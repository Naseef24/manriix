# ═══════════════════════════════════════════════════════════════════════════════
# Manriix Mission Parameters - Smooth Photographer Edition
# ═══════════════════════════════════════════════════════════════════════════════
# 
# These parameters control the "photographer's mindset" decision making:
# - When to switch targets
# - How long to wait for stability
# - Photo duration and distances
#
# Tune these based on your event type:
# - Wedding/formal: longer stability, higher thresholds
# - Party/casual: shorter stability, lower thresholds
# - Corporate: balanced settings
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# POI Manager Settings
# ───────────────────────────────────────────────────────────────────────────────
poi_manager_node:
  ros__parameters:
    # ═══════════════════════════════════════════════════════════════════════════
    # SCORE THRESHOLDS
    # ═══════════════════════════════════════════════════════════════════════════
    # Minimum score to consider a human POI worth capturing
    # Range: 0.0 - 1.0 | Higher = more selective
    human_score_threshold: 0.6
    
    # Minimum score to INTERRUPT current navigation for a human
    # Should be higher than human_score_threshold
    # Range: 0.0 - 1.0 | Higher = less interruptions
    human_interrupt_threshold: 0.75
    
    # Minimum score for scenic (landscape) POI
    # Range: 0.0 - 1.0
    scenic_score_threshold: 0.4
    
    # ═══════════════════════════════════════════════════════════════════════════
    # TIMING PARAMETERS
    # ═══════════════════════════════════════════════════════════════════════════
    # How long a human must be visible before we consider them "stable"
    # Prevents chasing people who are just walking through
    # Range: 0.5 - 5.0 seconds
    human_stability_time: 2.0
    
    # Minimum time between captures at the same location
    # Prevents photographing the same spot repeatedly
    # Range: 30 - 300 seconds
    min_capture_interval: 60.0
    
    # How long without seeing humans before switching to scenic mode
    # Range: 60 - 600 seconds
    scenic_check_interval: 120.0
    
    # Minimum time on one target before allowing switch (prevents flip-flopping)
    # Range: 3 - 15 seconds
    target_lock_time: 5.0
    
    # ═══════════════════════════════════════════════════════════════════════════
    # DISTANCE PARAMETERS
    # ═══════════════════════════════════════════════════════════════════════════
    # Distance from subject for optimal photo composition
    # Range: 1.5 - 4.0 meters
    photo_distance: 2.5
    
    # If robot is closer than this to current target, DON'T interrupt
    # "Almost there, finish the task"
    # Range: 1.0 - 3.0 meters
    completion_threshold: 1.5
    
    # ═══════════════════════════════════════════════════════════════════════════
    # HYSTERESIS (Anti-flip-flop)
    # ═══════════════════════════════════════════════════════════════════════════
    # New POI must score THIS MUCH HIGHER than current target to switch
    # Prevents constant switching between similar POIs
    # Range: 0.05 - 0.25
    switch_score_margin: 0.15


# ───────────────────────────────────────────────────────────────────────────────
# Mission Controller Settings
# ───────────────────────────────────────────────────────────────────────────────
mission_controller_node:
  ros__parameters:
    # ═══════════════════════════════════════════════════════════════════════════
    # PHOTO CAPTURE
    # ═══════════════════════════════════════════════════════════════════════════
    # How long to wait at POI for R6 camera to capture
    # Range: 30 - 120 seconds (depends on your R6 settings)
    photo_duration: 60.0
    
    # ═══════════════════════════════════════════════════════════════════════════
    # NAVIGATION
    # ═══════════════════════════════════════════════════════════════════════════
    # Maximum time to reach a navigation goal before giving up
    # Range: 60 - 300 seconds
    nav_timeout: 120.0
    
    # Distance at which robot is considered "arrived" at target
    # Range: 0.3 - 1.5 meters
    poi_arrival_threshold: 1.0
    
    # Same as POI manager - don't interrupt if closer than this
    completion_threshold: 1.5
    
    # ═══════════════════════════════════════════════════════════════════════════
    # TRANSITIONS
    # ═══════════════════════════════════════════════════════════════════════════
    # Speed reduction during transitions (1.0 = full speed, 0.5 = half speed)
    # Lower = smoother but slower transitions
    # Range: 0.3 - 1.0
    transition_speed_factor: 0.5
    
    # Time to evaluate a new POI before committing
    # Range: 0.5 - 3.0 seconds
    evaluation_time: 1.0


# ───────────────────────────────────────────────────────────────────────────────
# Exploration Settings
# ───────────────────────────────────────────────────────────────────────────────
exploration_node:
  ros__parameters:
    # Minimum frontier cluster size to consider
    min_frontier_size: 5
    
    # Maximum distance to search for frontiers
    exploration_radius: 15.0
    
    # Minimum distance for new exploration goals
    min_goal_distance: 1.5
    
    # Give up on exploration goal after this time
    goal_timeout: 30.0


# ───────────────────────────────────────────────────────────────────────────────
# Human Fusion Settings
# ───────────────────────────────────────────────────────────────────────────────
human_fusion_node:
  ros__parameters:
    # Distance threshold to merge detections into clusters
    cluster_distance_threshold: 1.0
    
    # Remove human if not seen for this long
    stale_timeout: 2.0
    
    # Publishing rate
    publish_rate: 10.0
    
    # Minimum detection confidence from ZED
    min_detection_confidence: 0.5


