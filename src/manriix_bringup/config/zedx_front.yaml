# ============================================================================
# Manriix — ZED X Front Camera (primary, with IMU)
#
# Purpose: feed cuVSLAM with rectified stereo + IMU. Nothing else.
# All other ZED SDK features (depth/tracking/detection) are OFF.
# This is the minimal-Argus profile so 3 cameras can coexist.
# ============================================================================

/**:
  ros__parameters:
    general:
      grab_resolution: 'SVGA'
      grab_frame_rate: 15
      pub_frame_rate: 15.0
      camera_name: 'zedx_front'
      camera_model: 'zedx'
      serial_number: 41911351

    video:
      # cuVSLAM consumes the gray rectified stream.
      # Keep color too so RViz/Foxglove can preview without re-enabling depth.
      publish_left_right: true
      publish_gray: true

    depth:
      # cuVSLAM does its own feature-based depth implicitly.
      # Disabling SDK depth is the single biggest Argus relief.
      depth_mode: 'NONE'

    pos_tracking:
      # cuVSLAM owns pose. Do NOT let the wrapper compete.
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    sensors:
      # IMU runs on its own thread inside SDK; we want it published.
      sensors_image_sync: false
      publish_imu_tf: true

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false