# D455 RealSense configuration for Manriix
# Rear-low mounted, facing backward — rear obstacle detection
# pointcloud enabled for Nav2 STVL
# depth image used for scan conversion via depthimage_to_laserscan

camera:
  camera:
    ros__parameters:
      # Streams
      depth_fps: 15
      depth_width: 848
      depth_height: 480
      color_fps: 15
      color_width: 848
      color_height: 480

      # pointcloud - needed for nav2 STVL 3D obstacle detection
      enable_pointcloud: true
      pointcloud_enable: true
      pointcloud.ordered_pc: false
      
      # Depth filters - reduce noise indoors
      spatial_filter.enable: true
      temporal_filter.enable: true
      hole_filling_filter.enable: true

      # Align depth to color for better scan conversion
      align_depth.enable: true

      # frame IDs - must match URDF
      base_frame_id: camera_link
      depth_frame_id: camera_depth_optical_frame
      color_frame_id: camera_color_optical_frame

      # TF - comes from urdf robot_state_publisher
      publish_tf: false

      # Use ROS system time not hardware timestamps
      depth_module.global_time_enabled: false
      rgb_camera.global_time_enabled: false
      motion_module.global_time_enabled: false