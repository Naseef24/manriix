/**:
    ros__parameters:
        general:
            grab_resolution: 'HD1080'
            grab_frame_rate: 15
            grab_compute_capping_fps: 15
            pub_frame_rate: 15.0
            pub_downscale_factor: 2.0

        depth:
            depth_mode: 'NEURAL_LIGHT'
            min_depth: 0.3
            max_depth: 8.0
            depth_stabilization: 0
            depth_texture_conf: 0
            depth_confidence: 80
            point_cloud_freq: 5.0

        pos_tracking:
            pos_tracking_enabled: false
            imu_fusion: false

        body_tracking:
            bt_enabled: false

        object_detection:
            od_enabled: false

        mapping:
            mapping_enabled: false

        sensors:
            sensors_image_sync: false
            sensors_pub_rate: 200.0
            publish_imu: true
            publish_imu_raw: false
            publish_imu_tf: false
            publish_cam_imu_transf: false