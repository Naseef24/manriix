costmap:
  costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05

      transform_tolerance: 1.0

      footprint: '[[0.40, 0.30], [0.40, -0.30], [-0.40, -0.30], [-0.40, 0.30]]'
      footprint_padding: 0.02

      plugins:
        - stvl_layer
        - inflation_layer

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true

        voxel_decay: 2.0
        decay_model: 0
        voxel_size: 0.05

        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0

        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0

        publish_voxel_map: true
        transform_tolerance: 1.0

        mapping_mode: false
        map_save_duration: 60.0

        observation_sources: oak_clusters

        oak_clusters:
          data_type: PointCloud2
          topic: /oak/obstacle_clusters

          marking: true
          clearing: true

          obstacle_range: 3.0

          min_obstacle_height: 0.05
          max_obstacle_height: 1.20

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          filter: "voxel"
          voxel_min_points: 1
          clear_after_reading: true

          min_z: 0.1
          max_z: 1.20

          vertical_fov_angle: 0.94
          horizontal_fov_angle: 1.55

          decay_acceleration: 5.0
          model_type: 0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

