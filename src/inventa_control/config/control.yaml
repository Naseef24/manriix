  gimbal_arm_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - joint5
      - joint6
      - joint7
      # - joint8
      
    stop_trajectory_duration: 0.5
    state_publish_rate: 50
    action_monitor_rate: 10

    # PID gains for each joint
    /gazebo_ros_control:    
      gains:
        joint5:
          p: 100.0  # Proportional gain
          i: 10.0   # Integral gain
          d: 1.0    # Derivative gain
        joint6:
          p: 100.0
          i: 10.0
          d: 1.0
        joint7:
          p: 100.0
          i: 10.0
          d: 1.0
