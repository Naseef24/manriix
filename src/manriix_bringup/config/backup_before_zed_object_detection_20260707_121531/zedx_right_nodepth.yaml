# ============================================================================
# Manriix — ZED X Right Camera (depth OFF — same as step 1)
#
# Mirrors zedx_left_nodepth.yaml. See that file for the explanation of
# why this exists as a separate file from step 1's config.
# ============================================================================

/**:
  ros__parameters:
    general:
      grab_resolution: 'SVGA'
      grab_frame_rate: 15
      pub_frame_rate: 15.0
      camera_name: 'zedx_right'
      camera_model: 'zedx'
      serial_number: 46311875

    video:
      publish_left_right: true
      publish_gray: true

    depth:
      depth_mode: 'NONE'

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    sensors:
      sensors_image_sync: false
      publish_imu_tf: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false