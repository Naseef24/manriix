# ============================================================================
# Manriix Nav2 Parameters — Carter-style architecture
#
# Modeled on:
#   nova_carter/nova_carter_navigation/params/nova_carter_navigation.yaml
#
# Adopts Carter's "all layers defined + plugins overridden at launch" pattern.
# The `plugins: [TO_BE_OVERRIDDEN]` placeholder is replaced at launch time by
# navigation_include.launch.py based on enable_* flags.
#
# Preserves Manriix-specific tuning:
#   - RegulatedPurePursuitController (verified tuned values)
#   - ThetaStarPlanner (verified tuned values)
#   - Crowd-safe behaviors (spin + wait, NO backup)
#   - collision_monitor (PolygonStop + PolygonSlow + FootprintApproach)
#   - velocity_smoother (deadband 0.01/0.05)
#
# OAK PIPELINE NOTE:
#   - Old RANSAC C++ + DFKI ground_consistency_layer REMOVED.
#   - Old STVL oak_voxel_layer REMOVED (was inactive scaffolding anyway).
#   - New: oak_obstacle_layer (ObstacleLayer with marking + clearing sources)
#     consuming /oak_obstacles/marking_points and /oak_obstacles/clearing_points
#     from manriix_oak_obstacles (edge-based detector).
#
# File: ~/manriix2_ws/src/manriix_navigation/config/nav2/nav2_params_carter.yaml
# ============================================================================

# ----------------------------------------------------------------------------
# SLAM TOOLBOX
# ----------------------------------------------------------------------------
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true    
    mode: mapping

    # lifelong params
    #lifelong_search_use_tree: false
    #lifelong_minimum_score: 0.1
    #lifelong_iou_match: 0.85
    #lifelong_node_removal_score: 0.04
    #lifelong_overlap_score_scale: 0.06
    #lifelong_constraint_multiplier: 0.08
    #lifelong_nearby_penalty: 0.001
    #lifelong_candidates_scale: 0.03
    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    #map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true
    
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0

    resolution: 0.05
    max_laser_range: 12.0
    min_laser_range: 0.2  # RPLidar A2M12 min range    
    minimum_time_interval: 0.5

    transform_timeout: 0.2
    tf_buffer_duration: 10.0
    stack_size_to_use: 40000000
    use_scan_matching: true
    use_scan_barycenter: true

    minimum_travel_distance: 0.2 #0.5
    minimum_travel_heading: 0.2 #0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 3.0 #1.5
    loop_search_maximum_distance: 6.0 #3.0

    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.8 #0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349

    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5

    use_response_expansion: true

# ----------------------------------------------------------------------------
# AMCL
# ----------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.2 #-1.0
    laser_model_type: "likelihood_field"
    max_beams: 60 #360
    max_particles: 3000 #2000
    min_particles: 1000 #500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1 #0.0
    recovery_alpha_slow: 0.001 #0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmnidirectionalMotionModel" #"nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2 #0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05 #0.2
    update_min_d: 0.05 #0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.6 #0.4
    z_short: 0.05
    scan_topic: /scan
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

# ----------------------------------------------------------------------------
# BT NAVIGATOR
# ----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /visual_slam/tracking/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/home/hype/manriix2_ws/install/manriix_navigation/share/manriix_navigation/behavior_trees/navigate_w_wait_priority.xml"
    default_nav_through_poses_bt_xml: "/home/hype/manriix2_ws/install/manriix_navigation/share/manriix_navigation/behavior_trees/navigate_through_poses_w_wait_priority.xml"
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ----------------------------------------------------------------------------
# CONTROLLER SERVER
# ----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "/visual_slam/tracking/odometry"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 1.0
      min_lookahead_dist: 0.8
      max_lookahead_dist: 1.5
      lookahead_time: 3.0
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

# ----------------------------------------------------------------------------
# LOCAL COSTMAP
# Carter pattern: ALL layer definitions present, `plugins` list is
# overridden at launch time by navigation_include.launch.py.
# ----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0 #5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4 #6
      height: 4 #6
      resolution: 0.05
      transform_tolerance: 0.5
      initial_transform_timeout: 60.0
      footprint: "[[0.55, 0.45], [0.55, -0.45], [-0.45, -0.45], [-0.45, 0.45]]"
      footprint_padding: 0.02
      always_send_full_costmap: True

      # Plugin list is overridden at launch — see navigation_include.launch.py.
      plugins: [TO_BE_OVERRIDDEN]

      # ---- Layer definitions (all defined; selected by `plugins` above) ----
      # static_map_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: True
      #   enabled: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.5 #10.0 #3.5
        inflation_radius: 0.55 #0.8 #0.45

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan oak_objects
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

        oak_objects:
          topic: /manriix/obstacle_cloud #/manriix/oak_obstacles_cloud
          max_obstacle_height: 1.0
          min_obstacle_height: 0.03
          data_type: "PointCloud2"
          marking: True
          clearing: True #False  # if you want OAK only to mark obstacles
          # obstacle_max_range: 5.0
          # obstacle_min_range: 0.0
          # optional: expected_update_rate, observation_persistence, etc.
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/pessimistic_static_map_slice"
        max_obstacle_distance: 1.0
        convert_to_binary_costmap: True
        
      # # ----------------------------------------------------------------------
      # # OAK ground_consistency_layer (DFKI plugin) — ACTIVE.
      # # Consumes outputs from oak_ground_remover_node (PCL RANSAC + clustering):
      # #   /oak/points_ground       (floor inliers, used for clearing)
      # #   /oak/points_obstacles    (clustered non-floor obstacles, used for marking)
      # # Probabilistic evidence-based marking + height-aware classification.
      # # ----------------------------------------------------------------------
      # oak_ground_consistency_layer:
      #   plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
      #   ground_points_topic: "/oak/points_ground"
      #   nonground_points_topic: "/oak/points_obstacles"
      #   ground_inc: 1.0
      #   nonground_inc: 1.5
      #   ground_decay: 0.92
      #   nonground_decay: 0.90
      #   nonground_occ_thresh: 2.0
      #   nonground_prob_thresh: 0.750
      #   max_score: 1000.0
      #   min_clearance: 0.05       # 5cm — catches phones, shoes, cables
      #   robot_height: 1.2         # Manriix envelope for tunnel detection
      #   tf_timeout: 0.2
      #   footprint_clearing_enabled: true
      #   enable_kpi_logging: false # disabled in production (perf + disk)

      # # ----------------------------------------------------------------------
      # # OAK STVL — Spatio-Temporal Voxel Layer (ACTIVE).
      # #
      # # Replaces standard ObstacleLayer. Two improvements over ObstacleLayer:
      # #   1. Time-based decay: cells expire automatically after voxel_decay
      # #      seconds even without a clearing raytrace. Solves ghost cells
      # #      where the camera can no longer see the area (occluded / rotated).
      # #   2. Per-voxel timestamps: more precise than ObstacleLayer's
      # #      single-buffer approach.
      # #
      # # Two sources from oak_ground_remover_node:
      # #   - oak_marking:  /oak/points_obstacles (clusters, marks voxels)
      # #   - oak_clearing: /oak/points_ground    (floor, raytrace clears voxels)
      # #
      # # voxel_decay: 2.0 means any voxel not re-confirmed for 2 sec disappears.
      # # Combined with tighter upstream cluster filtering (cluster_min_size=80),
      # # this is bulletproof against both flicker AND ghost cells.
      # # ----------------------------------------------------------------------
      # oak_stvl_layer:
      #   plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
      #   enabled: true
      #   voxel_decay: 2.0                  # cells expire 2 sec after last obs
      #   decay_model: 0                    # 0 = LINEAR (predictable)
      #   voxel_size: 0.05                  # 5cm voxels (match costmap resolution)
      #   track_unknown_space: false
      #   unknown_threshold: 15
      #   mark_threshold: 0
      #   update_footprint_enabled: true
      #   combination_method: 1             # 1 = MAX (LETHAL wins)
      #   origin_z: 0.0
      #   publish_voxel_map: true # default false          # set true to debug in foxglove
      #   transform_tolerance: 0.2
      #   #mapping_mode: false
      #   #map_save_duration: 60.0
      #   observation_sources: oak_marking oak_clearing
        
      #   oak_marking:
      #     data_type: PointCloud2
      #     topic: /oak/points_obstacles
      #     marking: true
      #     clearing: false
      #     obstacle_range: 3.0
      #     min_obstacle_height: 0.08
      #     max_obstacle_height: 1.20
      #     expected_update_rate: 0.0 #5.0
      #     observation_persistence: 0.0
      #     inf_is_valid: false
      #     #voxel_filter: false             # input already filtered by ground_remover
      #     filter: "voxel" # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on     voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
      #     clear_after_reading: true # default false, clear the buffer after the layer gets readings from it
      #     # ---- STVL-specific (FIX: defaults too narrow for OAK-D Pro W) ----
      #     # OAK-D Pro W has ~127° HFOV, ~79° VFOV. Defaults of 60°x40° were
      #     # causing "marks entire area" because STVL clearing authority cone
      #     # was much narrower than incoming marking points.
      #     #model_type: 0                   # 0 = depth camera (correct)
      #     #horizontal_fov_angle: 2.22      # 127° in radians
      #     #vertical_fov_angle: 1.38        # 79° in radians
      #     #vertical_fov_padding: 0.05      # small safety pad
      #     #voxel_min_points: 0
      #     #filter: "passthrough"
        
      #   oak_clearing:
      #     enabled: true #default true, can be toggled on/off with associated service call
