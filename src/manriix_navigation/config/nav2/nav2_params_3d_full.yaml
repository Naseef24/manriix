# ============================================================================
# Nav2 Parameters - 3D Mode with STVL (FIXED)
# ============================================================================
# 
# FIXES APPLIED:
#   [#4] Added left/right ZED cameras to STVL layers (local + global costmap)
#   [#5] Added left/right ZED cameras to Collision Monitor sources
#   [#3] Registered spin + backup in behavior_server plugins
#   [#9] Reduced BT retries to sane defaults + added path validity checking
#
# ORIGINAL: nav2_params_3d_full.yaml
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.2 #0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmnidirectionalMotionModel" #"nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05 #0.1
    update_min_d: 0.05 #0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.6 #0.5
    z_short: 0.05 #0.005 default, but can be increased to 0.1 to better handle short-range noise from ZED cameras
    scan_topic: scan
    set_initial_pose: false
    initial_pose:
      x: 1.109
      y: -0.881
      z: 0.0
      yaw: 1.56

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # [FIX #9] Updated BTs with sane retry counts and path validity
    default_nav_to_pose_bt_xml: "/home/hype/manriix2_ws/install/manriix_navigation/share/manriix_navigation/behavior_trees/navigate_w_wait_priority.xml"
    default_nav_through_poses_bt_xml: "/home/hype/manriix2_ws/install/manriix_navigation/share/manriix_navigation/behavior_trees/navigate_through_poses_w_wait_priority.xml"
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "/odometry/filtered"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4 #0.3 #0.4
      lookahead_dist: 1.0 #0.8 #0.4
      min_lookahead_dist: 0.8 #0.6 #0.3
      max_lookahead_dist: 1.5 #1.2 #0.6
      lookahead_time: 3.0 #2.0 #1.5
      rotate_to_heading_angular_vel: 1.0 #0.8 #1.0 #0.6
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true #false
      min_approach_linear_velocity: 0.05 #0.1
      approach_velocity_scaling_dist: 1.0 #0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0 #1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0 #1.5 #0.8 #0.6 #0.4
      regulated_linear_scaling_min_speed: 0.15 #0.08 #0.05 #0.1
      use_rotate_to_heading: true #false #true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6 ##0.8 #0.785 #0.4
      max_angular_accel: 2.0 #0.8 #0.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

# ============================================================================
# LOCAL COSTMAP
# [FIX #4] Added left and right ZED cameras to STVL observation sources
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.5
      initial_transform_timeout: 60.0
      footprint: "[[0.5, 0.4], [0.5, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      footprint_padding: 0.02
      plugins: ["voxel_layer", "stvl_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 3.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        
        # [FIX #4] All three ZED cameras for 360° 3D obstacle detection
        observation_sources: front_mark front_clear #left_mark left_clear right_mark right_clear
        
        # --- FRONT CAMERA (unchanged) ---
        front_mark:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 4.5
          min_obstacle_height: 0.3 #0.15
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true
        
        front_clear:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.2
          max_z: 5.0
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

        # --- LEFT CAMERA (NEW — FIX #4) ---
        left_mark:
          data_type: PointCloud2
          topic: /zedx_left/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 4.0
          min_obstacle_height: 0.3
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        left_clear:
          data_type: PointCloud2
          topic: /zedx_left/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.2
          max_z: 5.0
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

        # --- RIGHT CAMERA (NEW — FIX #4) ---
        right_mark:
          data_type: PointCloud2
          topic: /zedx_right/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 4.0
          min_obstacle_height: 0.3
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        right_clear:
          data_type: PointCloud2
          topic: /zedx_right/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.2
          max_z: 5.0
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.80

      always_send_full_costmap: True

