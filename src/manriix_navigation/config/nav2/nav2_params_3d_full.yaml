planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlanner2D"
    #   downsample_costmap: false
    #   downsampling_factor: 1
    #   tolerance: 0.25
    #   allow_unknown: false
    #   max_iterations: 1000000
    #   max_on_approach_iterations: 1000
    #   max_planning_time: 5.0
    #   cost_travel_multiplier: 3.0
    #   use_final_approach_orientation: true
    #   smooth_path: true
    #   downsample_obstacle_heuristic: True
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8            # 8-connected grid (diagonal movement)
      w_euc_cost: 1.0                # weight for euclidean distance
      w_traversal_cost: 2.0          # weight for costmap traversal cost
      allow_unknown: false
      use_final_approach_orientation: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 200 #1000
      do_refinement: false #True

# ============================================================================
# BEHAVIOR SERVER
# [FIX #3] Added spin as last-resort escape. NO backup (dangerous in crowds).
#
# STRATEGY:
#   wait = PRIMARY recovery (people move out of the way)
#   spin = LAST RESORT only (escape U-shaped obstacles where waiting won't help)
#   backup = NEVER (reversing into people behind the robot is unsafe)
#
# Spin is only triggered by the BT's top-level recovery AFTER all wait
# attempts are exhausted. In normal crowd operation, spin never fires.
# ============================================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Wait-first, spin as last resort, NO backup
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0 #0.8
    min_rotational_vel: 0.3 #0.2
    rotational_acc_lim: 1.5 #0.8

# ============================================================================
# COLLISION MONITOR
# [FIX #5] Added left and right ZED cameras to observation sources
#
# BEFORE: Only front camera + RPLidar = blind spots on sides for 3D obstacles
# AFTER:  All three cameras + RPLidar = 360° 3D obstacle detection
# ============================================================================
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel" #"cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_safe" #"cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]

    PolygonStop:
      type: "polygon"
      points: [0.60, 0.50, 0.60, -0.50, -0.50, -0.50, -0.50, 0.50]
      action_type: "stop"
      min_points: 2
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    PolygonSlow:
      type: "polygon"
      points: [1.0, 0.70, 1.0, -0.70, -0.60, -0.70, -0.60, 0.70]
      action_type: "slowdown"
      min_points: 2
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 2
      visualize: False
      enabled: True
    
    # [FIX #5] All three cameras + RPLidar for 360° collision detection
    # observation_sources: ["scan", "pointcloud_front", "pointcloud_left", "pointcloud_right"]
    observation_sources: ["scan", "pointcloud_front"]
    
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.1
      max_height: 2.0
      enabled: True
    
    pointcloud_front:
      type: "pointcloud"
      topic: "/zedx_front/zed_node/point_cloud/cloud_registered"
      min_height: 0.1
      max_height: 2.0
      enabled: True

    # [FIX #5] LEFT CAMERA — NEW
    pointcloud_left:
      type: "pointcloud"
      topic: "/zedx_left/zed_node/point_cloud/cloud_registered"
      min_height: 0.1
      max_height: 2.0
      enabled: True

    # [FIX #5] RIGHT CAMERA — NEW
    pointcloud_right:
      type: "pointcloud"
      topic: "/zedx_right/zed_node/point_cloud/cloud_registered"
      min_height: 0.1
      max_height: 2.0
      enabled: True

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # max_velocity: [0.3, 0.0, 0.6]
    # min_velocity: [-0.0, 0.0, -0.6]
    # max_accel: [0.3, 0.0, 0.5]
    # max_decel: [-0.5, 0.0, -0.8]
    # max_velocity: [0.4, 0.0, 1.0]      # was [0.3, 0.0, 0.8]
    # min_velocity: [-0.0, 0.0, -1.0]     # was [-0.0, 0.0, -0.8]
    # max_accel: [0.3, 0.0, 0.8]          # was [0.3, 0.0, 0.8]
    # max_decel: [-0.5, 0.0, -1.0]        # was [-0.5, 0.0, -1.0]   
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.0, 0.0, -1.0]
    max_accel: [0.5, 0.0, 2.0]          # angular accel: 1.2 → 2.0
    max_decel: [-0.8, 0.0, -2.5]        # angular decel: 1.5 → 2.5
    odom_topic: "odometry/filtered"
    odom_duration: 0.1
    # deadband_velocity: [0.01, 0.0, 0.01]
    deadband_velocity: [0.01, 0.0, 0.05] # angular deadband: 0.01 → 0.15
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0