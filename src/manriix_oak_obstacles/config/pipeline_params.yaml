# Parameters mirror the paper's notation (Eppenberger et al., IROS 2020),
# defaults taken from Section IV-A "Experimental Setup", then tuned on
# real OAK-D Pro W data.

pointcloud_filter_node:
  ros__parameters:
    input_topic: /oak/points
    output_dense_topic: /manriix/points_dense
    output_filtered_topic: /manriix/points_filtered
    target_frame: odom #base_footprint

    l_d: 5.0 #5.0     # depth trust limit [m]
    l_g: 0.05 #0.1 #0.0     # ground crop height [m], near-field base margin
    l_h: 1.0 #0.5 #1.0     # ceiling crop height [m]
    l_l: 0.05    # voxel leaf size [m]
    l_n: 30      # min neighbors (radius outlier filter)
    l_r: 0.5     # radius [m] (radius outlier filter)

    # Range-adaptive ground margin: l_g_eff(z) = l_g + ground_margin_k * sigma_z(z)
    # sigma_z(z) = z^2 * disparity_sigma_px / (focal_px * baseline_m)
    # focal_px: 772.0
    focal_px: 428.9 #<k[0] value>   # 386 if stereo is 640x400, 772 if 1280x720
    baseline_m: 0.075
    disparity_sigma_px: 0.5
    ground_margin_k: 3.0
    max_stale_transform_age: 0.5   # seconds

cluster_tracking_node:
  ros__parameters:
    input_topic: /manriix/points_filtered
    output_tracks_topic: /manriix/cluster_tracks
    output_markers_topic: /manriix/cluster_markers

    dbscan_eps: 0.2 #0.3            # [m] neighborhood radius
    dbscan_min_samples: 25 #15     # min points to form a dense region
    min_cluster_points: 60 #15     # discard clusters smaller than this

    track_max_assoc_dist: 0.6  # [m] GNN association gate
    track_timeout: 1.0         # [s] keep unmatched (occluded) tracks alive this long
    min_hits_to_confirm: 3     # consecutive matched frames before a track is published/drawn

    # Sec III-C.1 box-based cluster refinement (NEW — was previously
    # skipped/deferred; now implemented here, matching the paper)
    enable_box_refinement: true
    person_boxes_topic: /manriix/person_boxes
    preview_camera_info_topic: /oak/rgb/preview/camera_info   # same stream fusion_node/people_tracker_node use
    box_min_points_in_box: 5
    box_split_min_fraction: 0.5
    box_max_proj_points: 800

static_dynamic_classifier_node:
  ros__parameters:
    dense_topic: /manriix/points_dense
    tracks_topic: /manriix/cluster_tracks
    camera_info_topic: /oak/stereo/camera_info #/oak/right/camera_info
    camera_frame: oak_rgb_camera_optical_frame #oak_d_pro_w_rgb_camera_optical_frame #oak_right_camera_optical_frame
    map_frame: odom #base_footprint

    output_tracks_topic: /manriix/cluster_tracks_classified
    output_markers_topic: /manriix/classification_markers

    delta: 0.4          # [s] frame separation for voting (paper Sec IV-A)
    tau: 0.6 #0.4             # [s] consistency horizon
    l_NN: 0.45 #    0.35       # [m/s] velocity threshold
    l_abs_dyn: 100 #40       # absolute dynamic-vote-count threshold
    l_rel_dyn: 0.7 #0.8 #0.35        # relative dynamic-vote-fraction threshold

    occlusion_pixel_radius: 4.0    # [px]
    occlusion_depth_margin: 0.05   # [m]
    buffer_horizon: 1.5            # [s] history retained for lookback
    max_proj_points: 6000          # dense-cloud subsample for occlusion depth map

# people_tracker_node:
#   ros__parameters:
#     detections_topic: /oak/nn/spatial_detections
#     output_topic: /manriix/person_boxes
