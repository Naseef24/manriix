#This file contains common configuration options for the two costmaps used in the navigation stack for more details on the parameters in this file, and a full list of the parameters used by the costmaps, please see http://www.ros.org/wiki/costmap_2d

#The footprint of the robot 
footprint: [[-0.42, -0.4], [-0.42, 0.4], [0.42, 0.4], [0.42, -0.4]] #footprint of the robot
footprint_padding: 0.01

#Set the tolerance we're willing to have for tf transforms
transform_tolerance: 0.1

#Set map type
# map_type: costmap  #voxel

#Obstacle marking parameters
obstacle_range: 2.5
max_obstacle_height: 2.0
raytrace_range: 3.0

#Inscribed and circumscribed radius 
inscribed_radius: 0.2
circumscribed_radius: 0.3

#The cost at which a cell is considered an obstacle when a map is read from the map_server
lethal_cost_threshold: 100

footprint_clearing_enabled: true
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< Layer-01 >>>>>>>>>>>>>>>>>>>>>>>>>
inflater_layer:
  #Cost function parameters
  inflation_radius: 0.46 #robot_radius
  cost_scaling_factor: 10.0

# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< Layer-02 >>>>>>>>>>>>>>>>>>>>>>>>>
static_layer:
  map_topic: /map
  subscribe_to_updates: true

# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< Layer-03 >>>>>>>>>>>>>>>>>>>>>>>>>
obstacle_layer:
  publish_voxel_map: true #false
  # observation_sources: scan1 scan2 rs_cloud unitree_cloud
  observation_sources: scan1 scan2 
  scan1: {data_type: LaserScan, topic: /front/scan, marking: true, clearing: true, min_obstacle_height: -2.0, inf_is_valid: true}  
  scan2: {data_type: LaserScan, topic: /realsense_scan, marking: true, clearing: true, min_obstacle_height: -2.0, inf_is_valid: true}  
  # rs_cloud: {data_type: PointCloud2, topic: /camera/depth/color/points, marking: true, clearing: true, min_obstacle_height: 0.1, inf_is_valid: false}
  # unitree_cloud: {data_type: PointCloud2, topic: /unitree_lidar_l1/points, marking: true, clearing: true, min_obstacle_height: 0.1, inf_is_valid: false}





