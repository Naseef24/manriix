# dual_laser_merger configuration for Manriix
# Source: https://docs.ros.org/en/humble/p/dual_laser_merger/
#
# Merges RPLidar /scan + D455 /scan_rear → /scan_combined
# Both sensors are already in TF tree — offsets are 0.0
# target_frame: laser_link (RPLidar frame — primary sensor)
#
# TF chain confirmed:
#   base_link → laser_link  (RPLidar, x=0.345, rpy=0 0 3.14)
#   base_link → camera_link (D455,    x=-0.30, rpy=0 0 3.14159)

dual_laser_merger:
  ros__parameters:
    # Input topics
    laser_1_topic: /scan           # RPLidar A2M12 — primary 360° scan
    laser_2_topic: /scan_rear      # D455 depth → laserscan — rear arc

    # Output topic (remapped to /scan_combined in launch file)
    merged_topic: /scan_combined

    # Target TF frame — merge into RPLidar frame
    # Per official docs: TF from each laser frame to target_frame must exist
    target_frame: laser_link

    # Offsets — set to 0.0 because TF already encodes sensor positions
    # Per official docs: these are additional corrections on top of TF
    laser_1_x_offset: 0.0
    laser_1_y_offset: 0.0
    laser_1_yaw_offset: 0.0
    laser_2_x_offset: 0.0
    laser_2_y_offset: 0.0
    laser_2_yaw_offset: 0.0

    # Output scan parameters
    angle_min: -3.141592654        # full 360°
    angle_max:  3.141592654
    angle_increment: 0.00436       # ~0.25° resolution (matches RPLidar)
    scan_time: 0.1                 # 10Hz (RPLidar rate)
    range_min: 0.1
    range_max: 16.0                # RPLidar A2M12 max

    # Height filter — per official docs example: -1.0 to 1.0
    min_height: -1.0
    max_height: 1.0

    # Robot body exclusion — ignore returns inside robot body
    # Robot: 0.9m × 0.8m, half-diagonal = 0.60m
    allowed_radius: 0.60

    # Per official docs example: use_inf: false
    use_inf: false
    inf_epsilon: 1.0

    # Filters
    enable_shadow_filter: true
    enable_average_filter: true

    # Timing tolerance — 150ms covers RPLidar 10Hz + D455 15Hz difference
    tolerance: 0.15
    queue_size: 5