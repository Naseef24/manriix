# ============================================================================
# Manriix — ZED X Front Camera (Path A: ZED SDK VIO + depth for nvblox)
#
# This file enables ZED SDK Position Tracking as the VIO source for the
# EKF, AND turns on depth output for nvblox.
#
# Per Nav2's official VIO tutorial (docs.nav2.org/tutorials/docs/integrating_vio.html),
# we configure positional tracking to:
#   - PUBLISH the nav_msgs/Odometry topic /zedx_front/zed_node/odom
#   - NOT broadcast tf (EKF owns odom -> base_footprint)
#   - NOT use loop closure / area memory (pure VIO, not VSLAM)
#
# Topics this camera publishes that downstream consumers need:
#   - /zedx_front/zed_node/odom                       (VIO -> EKF as odom1)
#   - /zedx_front/zed_node/depth/depth_registered     (depth -> nvblox)
#   - /zedx_front/zed_node/depth/camera_info          (matching CameraInfo)
#   - /zedx_front/zed_node/left/color/rect/image      (color -> nvblox mesh)
#   - /zedx_front/zed_node/left/color/rect/camera_info
#   - /zedx_front/zed_node/imu/data                   (IMU -> EKF as imu0)
#
# Side cameras (zedx_left, zedx_right) are kept idle — no depth, no
# pos_tracking. They stay running so we can add them to the production
# stack later if a use case appears, but they don't contribute to VIO
# or nvblox in this config.
# ============================================================================

/**:
  ros__parameters:
    general:
      grab_resolution: 'SVGA'
      grab_frame_rate: 15
      pub_frame_rate: 15.0
      camera_name: 'zedx_front'
      camera_model: 'zedx'
      serial_number: 41911351

    video:
      # cuVSLAM consumes the gray rectified streams (unchanged from step 1).
      # Color is also published so nvblox can use it for the textured mesh.
      publish_left_right: true
      publish_gray: true

    depth:
      # NEURAL_LIGHT: fastest neural-based depth mode. Good balance for
      #               navigation at indoor venue ranges. Bump to NEURAL or
      #               NEURAL_PLUS if nvblox map quality is too coarse —
      #               cost is more GPU load.
      depth_mode: 'NEURAL_LIGHT'
      depth_stabilization: 1
      min_depth: 0.3
      max_depth: 7.0
      depth_confidence: 50
      point_cloud_freq: 10.0    # not used by nvblox; useful for RViz debug

    pos_tracking:
      # ──────────────────────────────────────────────────────────────────
      # cuVSLAM owns pose. ZED wrapper's positional tracking stays off.
      # cuVSLAM consumes the gray rectified streams from this camera.
      # nvblox consumes the depth stream from this camera.
      # ──────────────────────────────────────────────────────────────────
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    sensors:
      sensors_image_sync: false
      publish_imu_tf: true

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false