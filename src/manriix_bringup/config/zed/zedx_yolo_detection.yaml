/**:
    ros__parameters:
        # General settings
        general:
            grab_resolution: 'HD1080'
            grab_frame_rate: 15
            grab_compute_capping_fps: 0
            pub_frame_rate: 15.0
            pub_downscale_factor: 2.0

        # Depth settings
        depth:
            depth_mode: 'NEURAL_LIGHT'
            min_depth: 0.5
            max_depth: 12.0
            depth_stabilization: 1
            depth_texture_conf: 0
            depth_confidence: 80
            point_cloud_freq: 5.0

        # Positional tracking
        pos_tracking:
            pos_tracking_enabled: true
            imu_fusion: true

        # Body Tracking - DISABLED
        body_tracking:
            bt_enabled: false

        # Object Detection
        object_detection:
            od_enabled: false #true
            detection_model: 'CUSTOM_YOLOLIKE_BOX_OBJECTS'
            custom_onnx_file: '/home/hype/models/yolo11/yolo11n.onnx'
            allow_reduced_precision_inference: true
            max_range: 12.0
            enable_tracking: false
            filtering_mode: 'NMS3D'
            prediction_timeout: 0.5

        # Mapping - DISABLED
        mapping:
            mapping_enabled: false

        # SENSORS
        sensors:
            sensors_image_sync: false
            sensors_pub_rate: 200.0
            publish_imu: true
            publish_imu_raw: false
            publish_imu_tf: false
            publish_cam_imu_transf: false


