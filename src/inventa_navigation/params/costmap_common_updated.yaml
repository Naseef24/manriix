map_type: costmap
origin_z: 0.0
z_resolution: 0.2
z_voxels: 10

# Increased for outdoor navigation with a large robot
obstacle_range: 4.0  # Increased from 3.0 for better obstacle detection
raytrace_range: 4.5  # Increased from 3.5 for better clearing

publish_voxel_map: true
transform_tolerance: 0.8  # Increased for outdoor conditions with potential GPS/sensor delays
meter_scoring: true

# Updated footprint for a large 100kg four-wheel steering robot
footprint: [[0.6, 0.5], [0.6, -0.5], [-0.6, -0.5], [-0.6, 0.5]]  # Increased to match a larger robot

footprint_padding: 0.15  # Increased padding for safety

plugins:
- {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"} 
- {name: inflater_layer, type: "costmap_2d::InflationLayer"}

obstacles_layer:
  observation_sources: scan_multi merged_cloud camera_depth  # Using your existing sensor configuration
  
  scan_multi: {
    sensor_frame: front_lrf_link, 
    data_type: LaserScan, 
    topic: /scan_multi, 
    marking: true, 
    clearing: true, 
    min_obstacle_height: 0.0, 
    max_obstacle_height: 2.0, 
    obstacle_range: 4.0,  # Increased
    raytrace_range: 4.5   # Increased
  }
  
  merged_cloud: {
    sensor_frame: base_link, 
    data_type: PointCloud2, 
    topic: /merged_cloud, 
    marking: true, 
    clearing: true, 
    min_obstacle_height: 0.1, 
    max_obstacle_height: 2.0, 
    obstacle_range: 4.0,  # Increased
    raytrace_range: 4.5   # Increased
  } 
  
  camera_depth: {
    sensor_frame: camera_depth_frame, 
    data_type: PointCloud2, 
    topic: /camera/depth/color/points, 
    marking: true, 
    clearing: true, 
    min_obstacle_height: 0.1, 
    max_obstacle_height: 1.5,  # Increased for outdoor obstacles
    obstacle_range: 3.0, 
    raytrace_range: 3.5
  }

inflater_layer:
  inflation_radius: 0.4  # Increased from 0.25 for a larger safety margin around obstacles
  cost_scaling_factor: 5.0  # Added parameter for better cost decay with distance