# CAN Interface Configuration
can_interface: "can2"
can_bitrate: 1000000

# CubeMars Steering Actuators Configuration
cubemars:
  base_motor_id: 2  # Base CAN ID for steering actuators
  # Actuator mapping: FL=2, FR=3, RL=4, RR=5
  
  # Position limits (degrees)
  min_position: -120.0
  max_position: 120.0
  
  # Control parameters
  position_tolerance: 0.5  # degrees
  timeout: 0.1  # seconds

# Zltech Hub Motor Controllers Configuration
zltech:
  driver1_id: 0x601  # Left side (FL + RL)
  driver2_id: 0x602  # Right side (FR + RR)
  
  # Velocity limits (RPM)
  max_velocity: 10 #500
  min_velocity: -10 #-500
  
  # Control parameters
  velocity_tolerance: 5.0  # RPM
  timeout: 0.1  # seconds
  
  # Direction corrections
  invert_right_motors: true

# Joint name mappings (must match URDF)
joints:
  steering:
    - steering_front_left_joint
    - steering_front_right_joint
    - steering_rear_left_joint
    - steering_rear_right_joint
  
  wheels:
    - wheel_front_left_joint
    - wheel_front_right_joint
    - wheel_rear_left_joint
    - wheel_rear_right_joint

# Update rate for hardware interface
update_rate: 50  # Hz
