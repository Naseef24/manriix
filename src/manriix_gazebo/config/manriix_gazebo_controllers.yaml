controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    manriix_4ws_controller:
      type: manriix_4ws_controller/Manriix4WSController


joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0


manriix_4ws_controller:
  ros__parameters:
    # Joint names (match GAZEBO URDF)
    front_left_wheel_joint: wheel_front_left_joint
    front_right_wheel_joint: wheel_front_right_joint
    rear_left_wheel_joint: wheel_rear_left_joint
    rear_right_wheel_joint: wheel_rear_right_joint
    
    front_left_steering_joint: steering_front_left_joint
    front_right_steering_joint: steering_front_right_joint
    rear_left_steering_joint: steering_rear_left_joint
    rear_right_steering_joint: steering_rear_right_joint
    
    # Vehicle geometry
    wheelbase: 0.44 #0.30
    track_width: 0.635 #0.34
    wheel_radius: 0.101 #0.096
    steering_offset: 0.085 #0.0
    
    # Limits
    max_linear_velocity: 1.0 #1.5
    max_angular_velocity: 1.0 #3.14
    max_linear_acceleration: 1.0
    max_angular_acceleration: 1.0
    max_steering_angle: 0.785
    max_steering_rate: 2.0

    enable_angle_scaling: true
    max_scaled_angle: 0.15
    angle_scale_factor: 0.7
        
    # Safety
    cmd_vel_timeout: 0.5
    velocity_threshold: 0.01
    
    # Odometry
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0