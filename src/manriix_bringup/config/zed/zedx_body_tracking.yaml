# ZED X Optimized Configuration for Multi-Camera Object Detection
# Applied to all 3 cameras for human detection
#
# OPTIMIZATIONS APPLIED:
# - depth_mode: NEURAL_LIGHT (optimized for multi-camera, -40% GPU load)
# - grab_resolution: HD720 (sufficient for 2-8m detection, -60% bandwidth)
# - grab_frame_rate: 15 (balanced for real-time performance)
# - body_tracking: DISABLED (using object detection only)
# - pos_tracking + imu_fusion: ENABLED (required for SLAM/navigation)

/**:
    ros__parameters:
        # General settings - OPTIMIZED
        general:
            grab_resolution: 'SVGA'       # Changed from HD1200 - reduces load significantly
            grab_frame_rate: 30            # 15 FPS is sufficient for human detection

        # Depth settings - OPTIMIZED
        depth:
            depth_mode: 'NEURAL_LIGHT'     # Changed from NEURAL - optimized for multi-camera
            min_depth: 0.3                 # Minimum detection range (meters)
            max_depth: 10.0                # Reduced from 15.0 - matches object detection range
            depth_stabilization: 1         # Enable depth stabilization
            depth_texture_conf: 0  # Disable depth texture (which causes bgra8 confusion)


        # Positional tracking - REQUIRED for SLAM/Navigation
        pos_tracking:
            pos_tracking_enabled: true     # Keep enabled for SLAM
            imu_fusion: true               # Keep enabled for navigation

        # Body Tracking - DISABLED (using object detection instead)
        body_tracking:
            bt_enabled: false              # Disabled - object detection provides human positions
            bt_model: 'HUMAN_BODY_MEDIUM'
            bt_format: 'BODY_38'
            bt_allow_reduced_precision_inference: true
            bt_max_range: 10.0
            bt_body_fitting: true
            bt_enable_tracking: true
            bt_enable_segmentation: false
            bt_detection_confidence_threshold: 50
            bt_minimum_keypoints_threshold: 8

        # Object Detection - PRIMARY human detection method
        object_detection:
            od_enabled: true               # Main detection method
            detection_model: 'MULTI_CLASS_BOX_ACCURATE'  # Fast model for real-time
            allow_reduced_precision_inference: true   # Enable FP16 for speed
            max_range: 12.0                 # Detection range in meters
            enable_tracking: true          # Track objects across frames
            filtering_mode: 'NMS3D'        # 3D non-maximum suppression
            prediction_timeout: 2.0        # Prediction timeout in seconds
            class:
                people:
                    enabled: true
                    confidence_threshold: 40.0
                vehicle:
                    enabled: true
                    confidence_threshold: 45.0
                animal:
                    enabled: true
                    confidence_threshold: 35.0
                bag:
                    enabled: false
                    confidence_threshold: 40.0
                electronics:
                    enabled: false
                    confidence_threshold: 40.0
                fruit_vegetable:
                    enabled: false
                    confidence_threshold: 40.0
                sport:
                    enabled: false
                    confidence_threshold: 40.0

        # Point cloud - DISABLED (not needed for human detection)
        mapping:
            mapping_enabled: false

        # Sensors
        sensors:
            sensors_image_sync: true       # Synchronize sensors with video
