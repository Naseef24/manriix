# ============================================================================
# Manriix nvblox config — DYNAMIC MODE (Dynablox geometric detection)
#
# Purpose: Detect moving obstacles (people, carts, animals) geometrically
# WITHOUT any ML model. Dynablox uses TSDF freespace tracking + consecutive-
# frame occupancy state changes to flag dynamic voxels.
#
# Dynamic stuff → /nvblox_node/dynamic_occupancy_layer (decays over time)
# Static stuff → /nvblox_node/static_map_slice (preserved, no decay)
#
# Loaded as THIRD layer after:
#   1. nvblox_base.yaml             (NVIDIA core defaults)
#   2. specializations/nvblox_zed.yaml (NVIDIA ZED specialization)
#   3. THIS FILE                    (manriix-specific overrides)
#
# Every parameter below verified present in nvblox 3.2.5 via:
#   ros2 param list /nvblox_node
#   strings /opt/ros/humble/lib/libnvblox_ros_lib.so
# ============================================================================

/**:
  ros__parameters:
    # ─────────────────────────────────────────────────────────────────────────
    # TOP-LEVEL — MAPPING MODE
    # ─────────────────────────────────────────────────────────────────────────

    # === mapping_type ===
    # Verified valid strings in binary: static_tsdf, static_occupancy, dynamic
    # NVIDIA reference: nvblox_dynamics.yaml
    mapping_type: "dynamic"

    # ─────────────────────────────────────────────────────────────────────────
    # TOP-LEVEL — VENUE MAPPING PRESERVATION (FROM ORIGINAL CONFIG)
    # These override nvblox_base.yaml defaults to keep the full venue map.
    # ─────────────────────────────────────────────────────────────────────────

    # Map clearing frame — use base_footprint (URDF navigation root)
    # NVIDIA's nvblox_zed.yaml sets "zed_camera_link"; we use robot's nav root.
    map_clearing_frame_id: "base_footprint"

    # Map clearing radius — negative = NO clearing.
    # nvblox_base.yaml comment: "no map clearing if < 0.0"
    # For venue mapping we want the FULL map preserved.
    map_clearing_radius_m: -1.0

    # TSDF decay disabled — static voxels persist forever.
    # Default in base: 5.0 Hz (slow forgetting). We set 0.0 for venue
    # mapping. Dynamic detection uses a separate decay mechanism
    # (decay_dynamic_occupancy_rate_hz) on the dynamic layer.
    decay_tsdf_rate_hz: 0.0

    # Visualization frames — base_footprint for our URDF.
    esdf_slice_bounds_visualization_attachment_frame_id: "base_footprint"
    workspace_height_bounds_visualization_attachment_frame_id: "base_footprint"

    # Console diagnostics
    print_rates_to_console: true
    print_queue_drops_to_console: true

    # Depth integration rate cap — ZED publishes at 15 Hz (per zedx_front_depth.yaml)
    # so 20 Hz is sufficient headroom. NVIDIA base is 40 Hz.
    integrate_depth_rate_hz: 20.0

    # ─────────────────────────────────────────────────────────────────────────
    # STATIC MAPPER — tunings required for DYNAMIC MODE to work alongside it
    # Sourced verbatim from NVIDIA's nvblox_dynamics.yaml
    # ─────────────────────────────────────────────────────────────────────────

    static_mapper:
      # === Original venue-preservation belt-and-suspenders ===
      decay_integrator_deallocate_decayed_blocks: false
      exclude_last_view_from_decay: true

      # === ESDF slice — STATIC layer 2D Nav2 costmap slice ===
      # Heights are relative to base_footprint frame.
      esdf_slice_height:     0.50   # output slice center (torso height)
      esdf_slice_min_height: 0.15 #0.10   # min Z considered for obstacles above floor
      esdf_slice_max_height: 1.00   # max Z — captures torsos, chair backs

      # === DYNAMIC-MODE REQUIRED — TSDF integrator changes ===
      # Source: NVIDIA's nvblox_dynamics.yaml line-by-line.
      # These tune the static mapper so its TSDF + freespace tracking can
      # be consumed by the Dynablox dynamic detector.

      # Weighting mode = "constant" instead of default
      # "inverse_square_tsdf_distance_penalty". Verified valid string in
      # libnvblox_ros_lib.so. Required for Dynablox per NVIDIA reference.
      projective_integrator_weighting_mode: "constant"

      # When projected depth is invalid (<=0), decay voxel weight by 0.8.
      # Default is -1.0 (disabled). Description from binary:
      # "rapidly prune outliers stemming from dynamic objects and/or
      #  invalid sensor data."
      # Required for dynamic detection to work cleanly.
      projective_tsdf_integrator_invalid_depth_decay_factor: 0.8

      # === Freespace integrator settings — REQUIRED for Dynablox ===
      # These params are part of the freespace tracking mechanism that
      # Dynablox uses to detect "voxel was occupied, now free → dynamic".
      max_tsdf_distance_for_occupancy_m: 0.15
      max_unobserved_to_keep_consecutive_occupancy_ms: 200
      min_duration_since_occupied_for_freespace_ms: 250
      min_consecutive_occupancy_duration_for_reset_ms: 2000
      check_neighborhood: true

    # ─────────────────────────────────────────────────────────────────────────
    # DYNAMIC MAPPER — handles the "moving things" occupancy layer
    # All values sourced verbatim from NVIDIA's nvblox_dynamics.yaml
    # ─────────────────────────────────────────────────────────────────────────

    dynamic_mapper:
      # === Occupancy integrator — projects depth into the dynamic layer ===
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0

      # === Occupancy probability thresholds ===
      # These define when an occupancy voxel is considered:
      #   free      (low probability)
      #   occupied  (high probability)
      #   unknown   (between thresholds)
      free_region_occupancy_probability: 0.2
      occupied_region_occupancy_probability: 0.9
      unobserved_region_occupancy_probability: 0.35
      occupied_region_half_width_m: 0.15

      # === ESDF integrator for the dynamic layer ===
      esdf_integrator_min_weight: 2.0
      esdf_integrator_max_distance_m: 2.0

      # === Occupancy DECAY for dynamic layer ===
      # The dynamic occupancy layer DOES decay over time (unlike static TSDF).
      # This is how moving things "fade" from the costmap when they leave —
      # critical for the photography robot: someone walks past, gets briefly
      # marked dynamic, then fades out of the costmap as they leave view.
      free_region_decay_probability: 0.55
      occupied_region_decay_probability: 0.30

      # === ESDF slice — DYNAMIC layer 2D Nav2 costmap slice ===
      # Match the static slice heights so Nav2 can use both layers consistently.
      esdf_slice_height:     0.50
      esdf_slice_min_height: 0.15
      esdf_slice_max_height: 1.00
