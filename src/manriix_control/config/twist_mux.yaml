twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: cmd_vel
        timeout: 0.5
        priority: 10
      recovery:
        topic: cmd_vel_recovery
        timeout: 0.5
        priority: 8
      navigation:
        topic: cmd_vel_safe
        timeout: 1.0
        priority: 5
      external:
        topic: cmd_vel_external
        timeout: 0.5
        priority: 3
    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0
        priority: 255

