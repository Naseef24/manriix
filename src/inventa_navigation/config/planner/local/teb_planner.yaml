TebLocalPlannerROS:

  # Robot Configuration
  max_vel_x: 0.8           # Lower for a heavy outdoor robot
  min_vel_x: 0.3
  max_vel_x_backwards: 0.2
  max_vel_theta: 0.6       # Reduced for a heavy robot
  min_vel_theta: -0.6
  acc_lim_x: 0.5           # Much gentler acceleration for heavy robot
  acc_lim_theta: 0.6
  min_turning_radius: 0.25 # Small value for 4-wheel steering but not zero
  footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
    type: "polygon"
    vertices: [[-0.5, -0.4], [-0.5, 0.4], [0.5, 0.4], [0.5, -0.4]] # Larger footprint for 100kg robot

  # GoalTolerance
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.157
  free_goal_vel: false
  
  # Trajectory
  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 3.0
  feasibility_check_no_poses: 5
  
  # Obstacles
  min_obstacle_dist: 0.5 # Increased for a larger robot
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 30
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  # Optimization - increased for outdoor navigation
  no_inner_iterations: 7
  no_outer_iterations: 5
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.1
  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 800.0               # Slightly reduced for 4-wheel steering
  weight_kinematics_forward_drive: 800.0     # Slightly reduced for 4-wheel steering
  weight_kinematics_turning_radius: 2.0      # Increased for outdoor navigation
  weight_optimaltime: 1.0
  weight_obstacle: 50.0
  weight_dynamic_obstacle: 10.0 # not used with costmap converter
  weight_viapoint: 1.0
  
  # Homotopy Class Planner
  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 4
  selection_cost_hysteresis: 1.0
  selection_prefer_initial_plan: 0.95
  selection_obst_cost_scale: 1.0
  selection_alternative_time_cost: false
  
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5.0
  roadmap_graph_area_length_scale: 1.0
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  obstacle_heading_threshold: 0.45
  switching_blocking_period: 0.0
  viapoints_all_candidates: true
  delete_detours_backwards: true
  max_ratio_detours_duration_best_duration: 3.0
  visualize_hc_graph: false