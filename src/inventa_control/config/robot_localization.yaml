#Configuation for robot odometry EKF
#
frequency: 30 #50 #40

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

predict_to_current_time: true
# -------------------------------------
# Wheel odometry:
odom0: /swerve_controller/odom #/four_wheel_steering_controller/odom  
# odom0: /four_wheel_steering_controller/odom  
# odom0_config: [false, false, false,
#                false, false, false,
#                true, true, true,
#                false, false, true,
#                false, false, false]
# odom0_differential: false
odom0_config: [true, true, false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_queue_size: 10
odom0_nodelay: true
odom0_differential: false
odom0_relative: false

# --------------------------------------
# imu configure:

imu0: /imu
# imu0_config: [false, false, false,
#               true, true, false,
#               false, false, false,
#               true, true, true,
#               false, false, false]
# imu0_differential: false
