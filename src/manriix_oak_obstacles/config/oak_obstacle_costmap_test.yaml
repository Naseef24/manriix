# ================================================================
# Standalone Nav2 costmap test for OAK obstacles.
# Doubled namespace 'costmap: costmap:' is intentional — required
# by nav2_costmap_2d standalone executable (same as DFKI test).
# ================================================================
costmap:
  costmap:
    ros__parameters:
      global_frame: 'map'
      robot_base_frame: 'base_footprint'
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.4,0.3],[0.4,-0.3],[-0.4,-0.3],[-0.4,0.3]]'
      transform_tolerance: 1.0

      plugins: ['oak_obstacle_layer', 'inflation_layer']

      oak_obstacle_layer:
        plugin: 'nav2_costmap_2d::ObstacleLayer'
        enabled: true
        observation_sources: 'oak_marking oak_clearing'

        # Marking source — sparse, only obstacle pixels
        oak_marking:
          topic: '/oak_obstacles/marking_points'
          data_type: 'PointCloud2'
          marking: true
          clearing: false                     # don't raytrace this one
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          expected_update_rate: 5.0
          observation_persistence: 0.5
          inf_is_valid: false

        # Clearing source — full depth image, raytraces through free space
        oak_clearing:
          topic: '/oak_obstacles/clearing_points'
          data_type: 'PointCloud2'
          marking: false                      # this one DOESN'T mark
          clearing: true                      # but it DOES raytrace clear
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.2
          expected_update_rate: 5.0
          observation_persistence: 0.5
          inf_is_valid: false

      inflation_layer:
        plugin: 'nav2_costmap_2d::InflationLayer'
        inflation_radius: 0.45
        cost_scaling_factor: 5.0

      always_send_full_costmap: true