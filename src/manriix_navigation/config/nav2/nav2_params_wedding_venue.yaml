# ==================== CONTROLLER SERVER (Regulated Pure Pursuit) ====================
# Tuned for: slow, smooth, predictable movement around wedding guests
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "/odometry/filtered"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3

    FollowPath:
          plugin: "nav2_rotation_shim_controller::RotationShimController"
          primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
          angular_dist_threshold: 0.785
          forward_sampling_distance: 0.5
          rotate_to_heading_angular_vel: 0.3
          max_angular_accel: 0.5
          simulate_ahead_time: 1.0
          # RPP params below
          desired_linear_vel: 0.3
          lookahead_dist: 0.8
          min_lookahead_dist: 0.5
          max_lookahead_dist: 1.5
          lookahead_time: 1.5
          transform_tolerance: 0.1
          use_velocity_scaled_lookahead_dist: true
          min_approach_linear_velocity: 0.05
          approach_velocity_scaling_dist: 0.8
          use_collision_detection: false #true
          max_allowed_time_to_collision_up_to_carrot: 1.5
          use_regulated_linear_velocity_scaling: true
          use_cost_regulated_linear_velocity_scaling: true
          regulated_linear_scaling_min_radius: 0.6
          regulated_linear_scaling_min_speed: 0.05
          use_rotate_to_heading: false
          allow_reversing: false
          max_angular_accel: 0.5
          max_robot_pose_search_dist: 10.0
          use_interpolation: true

# ==================== PLANNER SERVER (SmacPlanner2D) ====================
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
          plugin: "nav2_theta_star_planner/ThetaStarPlanner"
          how_many_corners: 8
          w_euc_cost: 1.0
          w_traversal_cost: 2.0
          w_heuristic_cost: 1.0

# ==================== LOCAL COSTMAP ====================
# Tuned for: detecting people, dynamic obstacles near robot
# All 3 ZED X cameras + RPLidar
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4              # was 5 - wedding aisles are narrow
      height: 4
      resolution: 0.05
      transform_tolerance: 0.5
      initial_transform_timeout: 60.0
      footprint: "[[0.5, 0.4], [0.5, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      footprint_padding: 0.03
      plugins: ["voxel_layer", "stvl_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      # --- Keepout Filter (local costmap) ---
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
        transform_tolerance: 0.3

      # --- RPLidar 2D Voxel Layer ---
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.15   # match RPLidar A2M12 spec
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # --- 3D Spatio-Temporal Voxel Layer (3× ZED X cameras) ---
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 3.0         # was 5.0 - faster decay for moving people
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false  # local costmap: unknown = free (sensors watching)
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0

        observation_sources: front_mark front_clear #left_mark left_clear right_mark right_clear

        # === FRONT CAMERA (primary navigation sensor) ===
        front_mark:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 3.0 #4.0
          min_obstacle_height: 0.25   # detect kids, low tables
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        front_clear:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.1 #0.15
          max_z: 7.0 #5.0
          vertical_fov_angle: 0.8745 #1.22
          horizontal_fov_angle: 1.048 #1.85
          decay_acceleration: 5.0
          model_type: 0

        # === LEFT CAMERA (side safety) ===
        left_mark:
          data_type: PointCloud2
          topic: /zedx_left/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 3.0       # shorter range for sides
          min_obstacle_height: 0.5
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        left_clear:
          data_type: PointCloud2
          topic: /zedx_left/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.15
          max_z: 4.0
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

        # === RIGHT CAMERA (side safety) ===
        right_mark:
          data_type: PointCloud2
          topic: /zedx_right/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.5
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        right_clear:
          data_type: PointCloud2
          topic: /zedx_right/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.15
          max_z: 4.0
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

      # --- Inflation Layer ---
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0   # was 2.5 - gentler falloff
        inflation_radius: 0.90     # was 0.80 - wider buffer from guests

      always_send_full_costmap: True

# ==================== GLOBAL COSTMAP ====================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      width: 30             # was 50 - save CPU for wedding venue
      height: 30
      rolling_window: true
      resolution: 0.05
      transform_tolerance: 0.5
      initial_transform_timeout: 60.0
      track_unknown_space: true
      footprint: "[[0.5, 0.4], [0.5, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "stvl_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      # --- Keepout Filter (global costmap) ---
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
        transform_tolerance: 0.3

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0       # longer decay for global planning memory
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true #false
        transform_tolerance: 0.2 #0.5
        mapping_mode: false
        map_save_duration: 60.0

        observation_sources: front_mark front_clear #left_mark left_clear right_mark right_clear

        front_mark:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 3.0 #4.0
          min_obstacle_height: 0.25 #0.00
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        front_clear:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.1 #0.2
          max_z: 7.0 #5.0
          vertical_fov_angle: 0.8745 #1.22
          horizontal_fov_angle: 1.048 #1.85
          decay_acceleration: 5.0 #5.0
          model_type: 0

        left_mark:
          data_type: PointCloud2
          topic: /zedx_left/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        left_clear:
          data_type: PointCloud2
          topic: /zedx_left/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.2
          max_z: 4.0
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

        right_mark:
          data_type: PointCloud2
          topic: /zedx_right/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.25
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

        right_clear:
          data_type: PointCloud2
          topic: /zedx_right/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          min_z: 0.2
          max_z: 4.0
