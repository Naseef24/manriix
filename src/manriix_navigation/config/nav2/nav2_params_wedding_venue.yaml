      always_send_full_costmap: True

# ==================== SMOOTHER SERVER ====================
# Used by Route BT to smooth graph-computed paths for better controller tracking
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 200 #1000
      do_refinement: True

# ==================== BEHAVIOR SERVER ====================
# Only 'wait' registered. Costmap clearing via BT service nodes.
# No spin/backup (forward + in-place rotation only)
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

# ==================== COLLISION MONITOR ====================
# Last line of defense - full surround protection for wedding guests
# Includes rear protection for in-place rotation safety
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0        # was 5.0 - stop faster if sensor dies
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]

    # EMERGENCY STOP - full surround including rear
    # Front: 0.6m, Sides: 0.5m, Rear: 0.5m (~10-15cm clearance)
    PolygonStop:
      type: "polygon"
      points: [0.60, 0.50, 0.60, -0.50, -0.50, -0.50, -0.50, 0.50]
      action_type: "stop"
      min_points: 2            # was 4 - catch thin obstacles (child's leg)
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    # SLOWDOWN - wider surround zone, 30% speed
    # Front: 1.0m, Sides: 0.7m, Rear: 0.6m
    PolygonSlow:
      type: "polygon"
      points: [1.0, 0.70, 1.0, -0.70, -0.60, -0.70, -0.60, 0.70]
      action_type: "slowdown"
      min_points: 2
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    # PREDICTIVE APPROACH - simulates trajectory for collision prediction
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0    # was 1.2 - earlier braking
      simulation_time_step: 0.05    # was 0.1 - finer prediction
      min_points: 2
      visualize: False
      enabled: True

    # Sensor sources - RPLidar + all 3 ZED X cameras
    # observation_sources: ["scan", "pointcloud_front", "pointcloud_left", "pointcloud_right"]
    observation_sources: ["scan", "pointcloud_front"]

    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05          # detect floor cables
      max_height: 2.0
      enabled: True

    pointcloud_front:
      type: "pointcloud"
      topic: "/zedx_front/zed_node/point_cloud/cloud_registered"
      min_height: 0.10
      max_height: 2.0
      enabled: True

    pointcloud_left:
      type: "pointcloud"
      topic: "/zedx_left/zed_node/point_cloud/cloud_registered"
      min_height: 0.10
      max_height: 2.0
      enabled: True

    pointcloud_right:
      type: "pointcloud"
      topic: "/zedx_right/zed_node/point_cloud/cloud_registered"
      min_height: 0.10
      max_height: 2.0
      enabled: True

# ==================== VELOCITY SMOOTHER ====================
# Gentle, wedding-appropriate motion - NO reversing
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.6]     # was [0.8, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -0.6]    # was [-0.3, ...] - NO REVERSE
    max_accel: [0.3, 0.0, 0.5]        # was [0.5, 0.0, 0.8] - gentler
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: "odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 1.0

# ==================== MAP SERVER ====================
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# =============================================================================
# ROUTE SERVER (Nav2 Route Server)
# =============================================================================
# Architecture 1: Route → dense path → Controller (strict route following)
# The route server computes optimal routes through a pre-defined navigation
# graph (.geojson), outputs dense nav_msgs/Path for the controller to track.
# ComputeAndTrackRoute also monitors route progress and triggers operations.
#
# For wedding venue: robot MUST follow pre-planned routes (graph edges).
# If an edge is blocked (guest standing in path), the CollisionMonitor
# operation detects it and triggers rerouting around the blocked edge.
# =============================================================================
route_server:
  ros__parameters:
    use_sim_time: False
    base_frame: "base_footprint"
    route_frame: "map"

    # --- Path Generation ---
    path_density: 0.05              # Dense path point spacing (m) - match costmap resolution
    max_iterations: 0               # 0 = unlimited search iterations
    max_planning_time: 2.0          # Max planning time (seconds)

    # --- Corner Smoothing ---
    # Smooth transitions between edges for smoother controller tracking
    smooth_corners: true
    smoothing_radius: 0.8           # Radius of corner arc (m) - match robot turning radius

    # --- Costmap for nearest-neighbor search ---
    costmap_topic: 'global_costmap/costmap_raw'

    # --- Graph File Loader ---
    graph_file_loader: "GeoJsonGraphFileLoader"
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"
    # graph_filepath set via launch file argument

    # --- Edge Cost Functions ---
    # DistanceScorer: minimize total route distance, respects speed_limit metadata
    # CostmapScorer: avoid edges that cross high-cost areas (obstacles in costmap)
    # DynamicEdgesScorer: allow blocking/unblocking edges at runtime via service
    edge_cost_functions: ["DistanceScorer", "CostmapScorer", "DynamicEdgesScorer"]

    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
      weight: 1.0
      speed_tag: "speed_limit"      # Graph metadata key for % speed limits

    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"
      weight: 2.0                   # Strongly prefer edges away from obstacles
      costmap_topic: "global_costmap/costmap_raw"
      max_cost: 253.0               # Cost threshold = blocked
      use_maximum: true             # Use max cost on edge (conservative)
      invalid_on_collision: true    # Mark edge invalid if in collision
      invalid_off_map: true         # Mark edge invalid if off map

    DynamicEdgesScorer:
      plugin: "nav2_route::DynamicEdgesScorer"

    # --- Route Operations ---
    # AdjustSpeedLimit: publishes speed limits from graph metadata per-edge
    # CollisionMonitor: forward-looking collision check → reroute if blocked
    # ReroutingService: allows external service call to trigger reroute
    operations: ["AdjustSpeedLimit", "CollisionMonitor", "ReroutingService"]

    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
      speed_limit_topic: "speed_limit"
      speed_tag: "speed_limit"

    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      costmap_topic: "global_costmap/costmap_raw"
      rate: 2.0                     # Check at 2Hz (wedding = slow movement)
      max_cost: 253.0
      max_collision_dist: 3.0       # Look 3m ahead on route (enough for 0.3m/s)
      check_resolution: 1
      reroute_on_collision: true    # Reroute around blocked edge, don't fail

    ReroutingService:
      plugin: "nav2_route::ReroutingService"

    # --- Route Tracking ---
    tracker_update_rate: 20.0       # Match controller frequency (no need for 50Hz)
    aggregate_blocked_ids: true     # Remember all blocked edges during this request

    # --- Node Achievement ---
    # Generous radii because RPP controller may deviate slightly from path
    boundary_radius_to_achieve_node: 0.8   # Start/end node radius (m)
    radius_to_achieve_node: 1.2            # Intermediate node radius (m)

    # --- Pruning ---
    max_prune_dist_from_edge: 4.0   # Max dist to consider edge in-progress
    min_prune_dist_from_goal: 0.15
    min_prune_dist_from_start: 0.10
    prune_goal: true

    # --- Nearest-Neighbor Search ---
    enable_nn_search: true          # Use BFS in costmap for better start/goal matching
    max_nn_search_iterations: 10000
    num_nearest_nodes: 5

# =============================================================================
# KEEPOUT FILTER (Costmap Filter for restricted zones)
# =============================================================================
# Marks wedding venue restricted areas (e.g. stage, gift table, dance floor
# during ceremony) as lethal in both global and local costmaps.
# Requires:
#   1. A keepout mask .yaml/.pgm (same format as map, with restricted areas)
#   2. keepout_filter_mask_server (map_server instance publishing mask)
#   3. keepout_costmap_filter_info_server (publishing CostmapFilterInfo)
# =============================================================================

# Map Server instance for keepout filter mask
keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: False
    topic_name: "/keepout_filter_mask"
    # yaml_filename set via launch file argument (keepout mask yaml)

# Costmap Filter Info Server for keepout zones
keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0                         # 0 = Keepout Filter
    filter_info_topic: "/keepout_costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0