# =============================================================================
# Manriix Nav2 Parameters - 3D Mode with STVL
# =============================================================================
# Based on existing nav2_params.yaml with STVL layer added for 3D perception
#
# Changes from default 2D mode:
#   - Added STVL layer for cliff/overhead detection
#   - Uses ZED camera point clouds
#
# Usage:
#   ros2 launch manriix_navigation slam_nav.launch.py use_3d_perception:=true
#
# Requirements:
#   - sudo apt install ros-humble-spatio-temporal-voxel-layer
# =============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2 #Matches the default value in the official guide. 
                #This is a reasonable default for the expected process noise in odometry’s rotation estimate from rotation.
                #alpha1 controls how much rotation affects the robot’s rotation estimate. 
                #Increasing this value makes the system more cautious about rotational movements, assuming more uncertainty when the robot turns. 
                #Decreasing it makes the system more confident about its rotation estimates, which can be risky if your robot’s sensors aren’t very accurate.

    alpha2: 0.2 #Matches the default value. A suitable default for expected process noise in rotation estimate from translation.
                #alpha2 handles how forward motion affects rotation estimates. 
                #If you increase this value, the robot becomes more uncertain about its rotation when moving forward, leading to more conservative behavior. 
                #Decreasing it means the robot will be more confident that moving forward won’t affect its rotational accuracy, which might be too optimistic for many robots.

    alpha3: 0.2 #Matches the default. Appropriate for expected process noise in translation estimate from translation.
                #alpha3 determines how forward motion affects position estimates. 
                #Increasing this makes the robot more uncertain about its position when moving forward, causing it to rely more on sensor data. 
                #Decreasing it means the robot will trust its forward motion more, which can be good for robots with very accurate wheel encoders but risky for others.

    alpha4: 0.2 #Same as default. Works well for expected process noise in translation estimate from rotation in most cases.
                # alpha4 manages how rotation affects position estimates. 
                # When increased, the system assumes more position uncertainty during turns, making it more reliant on sensor data to confirm its location. 
                # Decreasing it means the robot will be more confident about maintaining position accuracy during turns, which might not be realistic for many robots.
    
    alpha5: 0.2 #Aligns with default. Good value for translation noise in omni models.
                # Specific to omnidirectional robots, this controls translation noise. 
                # Increasing this value makes the robot more cautious about its position estimates during omnidirectional movement. 
                # Decreasing it makes the robot more confident in its position during sideways motion, which should only be done if you have very accurate encoders.

    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
                # Same as default. 0.5m is a reasonable max distance to consider skipping beams that don’t match the map.
                # This parameter tells AMCL how different a laser reading can be from the expected map reading before being considered for skipping. 
                # For example, if a laser beam expects to hit a wall at 3 meters according to the map, but actually hits something at 2.3 meters, the difference is 0.7 meters. 
                # If this difference is larger than beam_skip_distance (i.e. 0.5 meters), this reading becomes a candidate for being skipped. 
                # Increasing the beam_skip_distance means more readings that don’t match the map will be considered for skipping, which helps when your environment changes often but might make localization less precise. 
                # Decreasing it means only readings that are very different from expectations will be considered for skipping, making localization more precise but potentially slower in changing environments.    

    beam_skip_error_threshold: 0.9
                # Matches default. 0.9 is a good percentage of beams to skip before forcing a full update due to bad convergence.
                # This parameter sets the maximum percentage of beams that can be skipped before AMCL forces a full sensor update due to poor convergence.

                # Increase it to allow more beams to be skipped, which can help performance in noisy environments but may reduce accuracy.
                # Decrease it to make the system more cautious, improving accuracy but increasing computational cost.    

    beam_skip_threshold: 0.3
    
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 15.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "/odometry/filtered"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      allow_reversing: true
      rotate_to_heading_min_angle: 1.2
      max_angular_accel: 0.8
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.5

# =============================================================================
# LOCAL COSTMAP - 3D MODE
# =============================================================================
# Uses STVL layer for 3D obstacle detection (cliffs, overhead obstacles)
# Plugin order: voxel_layer (RPLidar), stvl_layer (ZED), inflation_layer
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 1.0
      footprint: "[[0.5, 0.4], [0.5, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      footprint_padding: 0.02
      # STVL added between voxel_layer and inflation_layer
      plugins: ["voxel_layer", "stvl_layer", "inflation_layer"]
      
      # ---------------------------------------------------------------------
      # VOXEL LAYER - RPLidar (existing)
      # ---------------------------------------------------------------------
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # ---------------------------------------------------------------------
      # STVL LAYER - ZED Camera (NEW - 3D perception)
      # Detects: cliffs, overhead obstacles, full 3D volume
      # ---------------------------------------------------------------------
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 15.0          # Seconds before voxels fade
        decay_model: 0             # 0=linear, 1=exponential
        voxel_size: 0.05           # 5cm voxel resolution
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1      # 1=max
        origin_z: 0.0
        publish_voxel_map: true    # Enable for RViz visualization
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        
        observation_sources: zedx_front
        
        zedx_front:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: true
          obstacle_range: 4.5
          # ---------------------------------------------------------------
          # HEIGHT THRESHOLDS - Critical for cliff/overhead detection!
          # ---------------------------------------------------------------
          min_obstacle_height: -0.15     # Detect drops > 15cm (CLIFF)
          max_obstacle_height: 1.8       # Detect up to 1.8m (OVERHEAD)
          # ---------------------------------------------------------------
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
          max_z: 1.8
          min_z: 0.1
          vertical_fov_angle: 1.22       # ~70° (ZED X FOV)
          horizontal_fov_angle: 1.85     # ~106° (ZED X FOV)
          decay_acceleration: 5.0
          model_type: 0                  # 0=depth camera

      # ---------------------------------------------------------------------
      # INFLATION LAYER
      # ---------------------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.55

      always_send_full_costmap: True

# =============================================================================
# GLOBAL COSTMAP - 3D MODE
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      width: 50
      height: 50
      rolling_window: true
      resolution: 0.05
      transform_tolerance: 1.0
      track_unknown_space: true
      footprint: "[[0.5, 0.4], [0.5, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      footprint_padding: 0.02
      # STVL added between obstacle_layer and inflation_layer
      plugins: ["static_layer", "obstacle_layer", "stvl_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # ---------------------------------------------------------------------
      # STVL LAYER - ZED Camera (3D)
      # ---------------------------------------------------------------------
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 30.0          # Longer decay for global
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false   # Disable for global (save resources)
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        
        observation_sources: zedx_front
        
        zedx_front:
          data_type: PointCloud2
          topic: /zedx_front/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: true
          obstacle_range: 4.5
          min_obstacle_height: -0.15
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
          max_z: 1.8
          min_z: 0.1
          vertical_fov_angle: 1.22
          horizontal_fov_angle: 1.85
          decay_acceleration: 5.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.55

      always_send_full_costmap: True

# =============================================================================
# PLANNER - SmacPlannerHybrid (Ackermann/REEDS_SHEPP)
# =============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.45
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      debug_visualizations: false
      use_quadratic_cost_penalty: False
      downsample_obstacle_heuristic: True

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -0.8]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.8, 0.0, -1.0]
    odom_topic: "odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0