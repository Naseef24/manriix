# Human Clustering Node — Single Configuration File
# Loaded programmatically by human_clustering_node via config_path parameter.
# config_path is set in photographer_system_params.yaml.
#
# clustering_config.yaml has been deprecated — this is the sole config source.
#
# STRUCTURE NOTE: The human_clustering_node > ros__parameters wrapper is
# intentional. config_loader.py unwraps it on load. Do not flatten.

human_clustering_node:
  ros__parameters:

    # ── Canon R6 Camera ───────────────────────────────────────────────────────
    camera:
      model: "Canon R6"
      sensor:
        width: 36.0             # mm
        height: 24.0            # mm
      lens:
        type: "RF 24-105mm"
        focal_length: 24.0      # mm (fixed at widest)
      fov:
        horizontal: 73.7        # degrees
        vertical: 53.4          # degrees
      working_distance:
        min: 2.0                # metres
        max: 6.0                # metres

    # ── ZED X Specifications ──────────────────────────────────────────────────
    camera_specs:
      depth_fov:
        horizontal: 120.0
        vertical: 90.0
      rgb_fov:
        horizontal: 120.0
        vertical: 90.0
      effective_range:
        min: 0.3                # metres
        max: 8.0                # metres
        max_detection_distance: 15.0  # ← ADD: hard reject beyond this distance
      optimal_scanning_overlap: 30.0   # degrees

    # ── Frame Transforms ──────────────────────────────────────────────────────
    transform:
      camera_frame: "zedx_front_left_camera_frame"
      base_frame:   "base_footprint"
      map_frame:    "map"
      tf_timeout:   0.1                # seconds (capped at 0.1 in code for real-time)
      map_origin:   [0.0, 0.0, 0.0]

    # ── Local Visualisation (matplotlib) ──────────────────────────────────────
    # Disabled for headless Jetson. Web interface uses /web/* topics.
    visualization:
      enabled: false
      matplotlib:
        max_range:   8.0
        update_rate: 10.0
      colors:
        human:          '#4ECDC4'
        robot:          '#66CC66'
        robot_heading:  '#88CC88'
        cluster:        '#45B7D1'
        optimal:        '#FFD93D'
        axes:           '#FFFFFF'
        background:     '#282C34'
        fov:            '#66CC66'
        free:           '#3E4451'
        occupied:       '#FF6B6B'

    # ── Debug ─────────────────────────────────────────────────────────────────
    debug:
      print_transforms: false
      print_positions:  false
      print_clusters:   false

    # ── Occupancy Map ─────────────────────────────────────────────────────────
    map:
      free_threshold:        20
      occupied_threshold:    80
      unknown_cell_strategy: "cautious"   # cautious | exploratory | adaptive

    # ── Obstacle Analysis ─────────────────────────────────────────────────────
    obstacle:
      min_safety_margin:       2     # cells
      max_safety_margin:       5     # cells
      density_radius:          10    # cells
      complexity_calculation:  "entropy"  # entropy | variance | gradient

    # ── Position Scoring ──────────────────────────────────────────────────────
    # NOTE: obstacle_proximity_weight, environment_complexity_weight,
    # temporal_consistency_weight are used by the obstacle analyser.
    # The weights: dict controls the final position score — must sum to 1.0.
    position:
      reachability_check: true
      obstacle_proximity_weight:      0.20   # obstacle analyser input weight
      environment_complexity_weight:  0.15   # obstacle analyser input weight
      temporal_consistency_weight:    0.10   # temporal smoother input weight
      history_length: 10
      formation_scores:
        line:          1.00
        formal_pose:   0.95
        circle:        0.90
        pair:          0.85
        single_person: 0.80
        small_group:   0.80
        large_group:   0.70
        scattered:     0.60
        unknown:       0.50
      weights:
        # FIXED: was summing to 1.15. Reduced density, environment_complexity,
        # path_feasibility by 0.05 each. Sum is now exactly 1.00.
        # distance:               0.20
        # size:                   0.10
        # density:                0.05   # was 0.10
        # formation:              0.10
        # stability:              0.10
        # composition:            0.15
        # obstacle_proximity:     0.15
        # environment_complexity: 0.05   # was 0.10
        # path_feasibility:       0.05   # was 0.10
        # temporal_consistency:   0.05
        # # SUM:                  1.00 ✓
        # distance:               0.20   # keep (commented out in code anyway)
        size:                   0.08   # was 0.10
        density:                0.05   # keep
        formation:              0.10   # keep
        stability:              0.10   # keep
        # composition:            0.15   # keep (commented out in code anyway)
        obstacle_proximity:     0.12   # was 0.15
        environment_complexity: 0.05   # keep
        path_feasibility:       0.16   # was 0.05 ← KEY CHANGE
        temporal_consistency:   0.05   # keep
        # SUM:                  1.00 ✓
        
    # ── Movement Detection ────────────────────────────────────────────────────
    movement:
      distance_threshold:       0.4
      orientation_threshold:    15
      position_stable_duration: 1.0

    # ── Target Detection ──────────────────────────────────────────────────────
    target_detection:
      scan_region_radius:             1.0
      position_change_threshold:      0.05
      position_stable_duration:       0.5
      check_orientation:              false
      orientation_tolerance_degrees:  15.0
      scan_duration:                  120.0
      enable_position_stability_check: false

    # ── Recovery ──────────────────────────────────────────────────────────────
    recovery:
      orientation_scan_angles:      6
      orientation_wait_time:        1.0
      max_recovery_attempts:        3
      fallback_distance_threshold:  1.5
      no_data_timeout:              999.0 #60.0
      enable_orientation_recovery:  false #true
      enable_fallback_positioning:  true

    # ── BIRCH Clustering ──────────────────────────────────────────────────────
    birch:
      enabled:            true
      threshold:          1.5
      branching_factor:   50
      n_clusters:         null     # null = auto-determine
      adaptive_threshold: true
      min_threshold:      1.0
      max_threshold:      2.0
      micro_batch_size:   3
      window_size:        150      # 5s at 30 FPS

    # ── GPU Acceleration ──────────────────────────────────────────────────────
    gpu:
      enabled:             true
      device_id:           0
      memory_limit:        4096    # MB
      use_unified_memory:  false   # Jetson optimisation — enable only on hardware

    # ── Kalman Tracking ───────────────────────────────────────────────────────
    tracking:
      use_kalman:              true
      max_tracks:              100
      max_age:                 10
      min_hits:                3
      min_confidence:          0.3
      prediction_horizon:      1.0
      hungarian_max_distance:  2.0

    # ── JIT Compilation ───────────────────────────────────────────────────────
    # Numba 0.62.1 + CUDA confirmed on Jetson AGX Orin. GPU threshold: 30 points.
    jit:
      enabled:         true    # Numba 0.62.1 confirmed available
      use_numba:       true
      use_cuda_jit:    true    # CUDA confirmed available
      cache_compiled:  true    # Cache JIT-compiled functions

    # ── Frame Processing ──────────────────────────────────────────────────────
    frame_processing:
      enable_skipping:      true
      max_skip_frames:      3
      enable_interpolation: true
      adaptive_processing:  true

    # ── Quality Control ───────────────────────────────────────────────────────
    quality_control:
      auto_adjust:  true
      target_fps:   30.0
      min_fps:      15.0
      hysteresis:   0.1

    # ── Performance Monitoring ────────────────────────────────────────────────
    monitoring:
      enabled:                  true
      publish_rate:             1.0    # Hz
      history_size:             100
      enable_jetson_monitoring: true
      enable_profiling:         false