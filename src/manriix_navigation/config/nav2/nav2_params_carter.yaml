# ----------------------------------------------------------------------------
# GLOBAL COSTMAP (Carter pattern)
# Note: OAK obstacle layer is LOCAL ONLY — same as the old DFKI layer was.
# ----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      width: 30 #50
      height: 30 #50
      rolling_window: true
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: false #true
      footprint: "[[0.55, 0.45], [0.55, -0.45], [-0.45, -0.45], [-0.45, 0.45]]"
      footprint_padding: 0.02
      mark_threshold: 2
      always_send_full_costmap: True

      # Plugin list is overridden at launch — see navigation_include.launch.py.
      plugins: [TO_BE_OVERRIDDEN]

      # ---- Layer definitions ----
      static_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.5 #10.0 #3.5
        inflation_radius: 0.55 #0.8 #0.45
                
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
                          
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        max_obstacle_distance: 1.0
        convert_to_binary_costmap: True


      # oak_stvl_layer:
