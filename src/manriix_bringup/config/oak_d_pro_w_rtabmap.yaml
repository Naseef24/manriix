# ═══════════════════════════════════════════════════════════════════════════════
# OAK-D Pro W Configuration for RTAB-Map (Step 3)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Pipeline: RGBD (RGB + aligned depth) + IMU @ ~92 Hz
# Purpose: Feed RTAB-Map with synced RGB+depth+camera_info for mapping
#
# Architecture: RTAB-Map uses EKF (/odometry/filtered) as external odometry.
# Visual odometry from OAK-D is DISABLED in RTAB-Map (visual_odometry:=false)
# because OAK-D visual odom consistently fails with inliers=0 in our environment.
#
# Resolution naming for depthai_ros_driver (verified from sensor capabilities):
#   IMX378 (RGB):   '1080P', '4K', '12MP' — NOT '720'
#   OV9282 (mono):  '400P', '720P', '800P' — NOT '720'
# ═══════════════════════════════════════════════════════════════════════════════

/oak_d_pro_w:
  ros__parameters:
    camera:
      i_nn_type: 'none'
      i_pipeline_type: 'RGBD'
      i_enable_imu: true
      i_enable_ir: false

    rgb:
      i_resolution: '1080P'
      i_fps: 15.0
      i_publish_topic: true
      i_low_bandwidth: false

    left:
      i_resolution: '720P'
      i_fps: 15.0
      i_publish_topic: false

    right:
      i_resolution: '720P'
      i_fps: 15.0
      i_publish_topic: false

    stereo:
      i_align_depth: true
      i_subpixel: true                # 5x finer depth resolution
      i_lr_check: true                # rejects depth pixels that fail consistency
      i_lrc_threshold: 5
      i_board_socket_id: 0
      i_fps: 15.0
      i_min_depth: 200                # 20cm
      i_max_depth: 5000               # 5m
      i_confidence_threshold: 230     # higher = cleaner depth (default 200)
      i_enable_spatial_filter: false  # off — speckle warning
      i_enable_temporal_filter: true
      i_enable_speckle_filter: false  # off — was triggering memory warning
      i_extended_disp: false