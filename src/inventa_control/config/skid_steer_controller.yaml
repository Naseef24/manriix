joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

skid_steer_controller:
  type: "diff_drive_controller/DiffDriveController"
  left_wheel: ['ffl_wheel_joint', 'rfl_wheel_joint']
  right_wheel: ['ffr_wheel_joint', 'rfr_wheel_joint']

  publish_rate: 50
  pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
  twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
  cmd_vel_timeout: 0.25

  # Wheel separation and radius
  wheel_separation: 0.291
  wheel_radius: 0.101

  # Wheel separation and radius multipliers
  wheel_separation_multiplier: 1.0
  wheel_radius_multiplier: 1.0

  # Velocity and acceleration limits
  linear:
    x:
      has_velocity_limits: true
      max_velocity: 1.5
      min_velocity: -1.5
      has_acceleration_limits: true
      max_acceleration: 1.0
      min_acceleration: -1.0

  angular:
    z:
      has_velocity_limits: true
      max_velocity: 2.0
      min_velocity: -2.0
      has_acceleration_limits: true
      max_acceleration: 1.0
      min_acceleration: -1.0

  enable_odom_tf: false
  # base_frame_id: base_footprint

  # PID Gains
  gazebo_ros_control:
    pid_gains:
      ffl_wheel_joint: {p: 50.0, i: 0.1, d: 0.0}
      ffr_wheel_joint: {p: 50.0, i: 0.1, d: 0.0}
      rfl_wheel_joint: {p: 50.0, i: 0.1, d: 0.0}
      rfr_wheel_joint: {p: 50.0, i: 0.1, d: 0.0}

# Keep your gimbal_arm_controller configuration
gimbal_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint5
    - joint6
    - joint7
  stop_trajectory_duration: 0.5
  state_publish_rate: 50
  action_monitor_rate: 10