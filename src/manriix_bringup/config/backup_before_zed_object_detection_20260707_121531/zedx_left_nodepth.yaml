# ============================================================================
# Manriix — ZED X Left Camera (depth OFF — same as step 1)
#
# Side cameras stay in their minimal-Argus profile. They feed cuVSLAM
# extra stereo coverage but do NOT feed nvblox (only front camera goes
# to nvblox in step 2).
#
# This file is functionally identical to step 1's zedx_left.yaml.
# It exists as a separate file so step 2 is self-contained and any future
# changes to step 1's config don't accidentally affect step 2.
# ============================================================================

/**:
  ros__parameters:
    general:
      grab_resolution: 'SVGA'
      grab_frame_rate: 15
      pub_frame_rate: 15.0
      camera_name: 'zedx_left'
      camera_model: 'zedx'
      serial_number: 40487925

    video:
      publish_left_right: true
      publish_gray: true

    depth:
      depth_mode: 'NONE'    # nvblox doesn't consume this camera

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    sensors:
      sensors_image_sync: false
      publish_imu_tf: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false