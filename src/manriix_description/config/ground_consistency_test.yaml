# ============================================================================
# ground_consistency_test.yaml
#
# Standalone costmap test for DFKI's nav2_ground_consistency_costmap_plugin.
#
# Note: nav2_costmap_2d standalone executable always names its node "costmap"
# (regardless of remaps). The YAML root MUST match that name.
#
# Consumes:
#   /oak/points_ground       (RANSAC inliers)
#   /oak/points_obstacles    (RANSAC outliers)
#
# Produces:
#   /costmap/costmap         (OccupancyGrid for viz)
#   /costmap/published_footprint
#
# File: ~/manriix2_ws/src/manriix_description/config/ground_consistency_test.yaml
# ============================================================================

costmap:
  costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.5

      footprint: "[[0.5, 0.4], [0.5, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      footprint_padding: 0.02

      always_send_full_costmap: true

      plugins: ["ground_consistency_layer", "inflation_layer"]

      ground_consistency_layer:
        plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
        ground_points_topic: "/oak/points_ground"
        nonground_points_topic: "/oak/points_obstacles"
        ground_inc: 1.0
        nonground_inc: 1.5
        ground_decay: 0.92
        nonground_decay: 0.90
        nonground_occ_thresh: 2.0
        nonground_prob_thresh: 0.750
        max_score: 1000.0
        min_clearance: 0.03
        robot_height: 1.2
        tf_timeout: 0.2
        footprint_clearing_enabled: true
        enable_kpi_logging: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.5
        inflation_radius: 0.45