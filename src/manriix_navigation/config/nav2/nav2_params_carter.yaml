      #   voxel_size: 0.05                  # 5cm voxels (match costmap resolution)
      #   track_unknown_space: false
      #   unknown_threshold: 15
      #   mark_threshold: 2
      #   update_footprint_enabled: true
      #   combination_method: 1             # 1 = MAX (LETHAL wins)
      #   origin_z: 0.0
      #   publish_voxel_map: true # default false          # set true to debug in foxglove
      #   transform_tolerance: 0.2
      #   #mapping_mode: false
      #   #map_save_duration: 60.0
      #   observation_sources: oak_marking oak_clearing
        
      #   oak_marking:
      #     data_type: PointCloud2
      #     topic: /oak/points_obstacles
      #     marking: true
      #     clearing: false
      #     obstacle_range: 3.0
      #     min_obstacle_height: 0.08
      #     max_obstacle_height: 1.20
      #     expected_update_rate: 0.0 #5.0
      #     observation_persistence: 0.0
      #     inf_is_valid: false
      #     #voxel_filter: false             # input already filtered by ground_remover
      #     filter: "voxel" # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on     voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
      #     clear_after_reading: true # default false, clear the buffer after the layer gets readings from it
      #     # ---- STVL-specific (FIX: defaults too narrow for OAK-D Pro W) ----
      #     # OAK-D Pro W has ~127° HFOV, ~79° VFOV. Defaults of 60°x40° were
      #     # causing "marks entire area" because STVL clearing authority cone
      #     # was much narrower than incoming marking points.
      #     #model_type: 0                   # 0 = depth camera (correct)
      #     #horizontal_fov_angle: 2.22      # 127° in radians
      #     #vertical_fov_angle: 1.38        # 79° in radians
