# =============================================================================
# Manriix2 Nav2 Parameters - WEDDING VENUE Configuration
# =============================================================================
# Purpose: Indoor event venue (wedding) with guests, tables, decorations
# Strategy: Route-following with safety-first costmap clearing
# Movement: Forward only + in-place rotations. NO reversing, NO U-turns
# Sensors: RPLidar A2M12 (360° 2D) + 3× ZED X cameras (3D pointclouds)
# Localization: AMCL + EKF (NOT ZED visual odometry)
#
# File: /home/hype/manriix2_ws/src/manriix_navigation/config/nav2/nav2_params_wedding_venue.yaml
# BTs:  navigate_route_safety.xml, navigate_through_poses_route_safety.xml
# =============================================================================

# ==================== AMCL ====================
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beams_skip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0 #100.0
    laser_min_range: 0.2 #-1.0
    laser_model_type: "likelihood_field"
    max_beams: 120 #60
    max_particles: 3000 #2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: -0.486
      y: -0.483
      z: 0.0
      yaw: -0.030
    first_map_only: false

