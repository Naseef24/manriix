# ----------------------------------------------------------------------------
# MAP SERVER
# ----------------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ----------------------------------------------------------------------------
# PLANNER SERVER
# ----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      use_final_approach_orientation: true

# ----------------------------------------------------------------------------
# SMOOTHER SERVER
# ----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 200
      do_refinement: false

# ----------------------------------------------------------------------------
# BEHAVIOR SERVER — crowd-safe (spin + wait only, NO backup)
# ----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.2

# ----------------------------------------------------------------------------
# COLLISION MONITOR — twist_mux compatible (cmd_vel → cmd_vel_safe)
# Updated: pointcloud_oak now uses /oak_obstacles/marking_points
# ----------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]

    PolygonStop:
      type: "polygon"
      points: [0.80, 0.70, 0.80, -0.70, -0.70, -0.70, -0.70, 0.70]
      action_type: "stop"
      min_points: 2
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    PolygonSlow:
      type: "polygon"
      points: [1.2, 0.80, 1.2, -0.80, -0.70, -0.80, -0.70, 0.80]
      action_type: "slowdown"
      min_points: 2
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 2
      visualize: False
      enabled: True

    observation_sources: ["scan", "pointcloud_front", "pointcloud_oak"]

    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.1
      max_height: 2.0
      enabled: True

    pointcloud_front:
      type: "pointcloud"
      topic: "/zedx_front/zed_node/point_cloud/cloud_registered"
      min_height: 0.10
      max_height: 2.0
      enabled: True

    pointcloud_oak:
      type: "pointcloud"
      topic: "/manriix/obstacle_cloud" #"/manriix/oak_obstacles_cloud" #"/oak/points_obstacles"
      min_height: 0.10
      max_height: 1.20
      enabled: True

# ----------------------------------------------------------------------------
# VELOCITY SMOOTHER (Manriix-tuned deadband)
# ----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.0, 0.0, -1.0]
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.8, 0.0, -2.5]
    odom_topic: "/visual_slam/tracking/odometry"
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.05]
    velocity_timeout: 1.0

# ----------------------------------------------------------------------------
# WAYPOINT FOLLOWER
# ----------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

# ----------------------------------------------------------------------------
# ROBOT STATE PUBLISHER
# ----------------------------------------------------------------------------
robot_state_publisher:
  ros__parameters:
    use_sim_time: False

