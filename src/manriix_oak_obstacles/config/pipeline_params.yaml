#     output_markers_topic: /manriix/fusion_markers

#     gamma: 1.5             # [1/s] association frequency threshold (paper Sec IV-A)
#     freq_window: 2.0        # [s] window for measuring f_a
#     assoc_gate_xy: 0.7      # [m] person<->cluster association gate (x-y plane)
#     person_label_hold: 1.5  # [s] keep 'person' after last association

people_tracker_node:
  ros__parameters:
    detections_topic: /oak/nn/spatial_detections
    output_topic: /manriix/person_boxes
    confidence_threshold: 0.5
    iou_threshold: 0.3            # NEW — replaces max_assoc_dist
    box_timeout: 0.7
    min_hits_to_confirm: 2
    publish_debug_image: true
    image_topic: /oak/nn/passthrough/image_raw
    debug_image_topic: /manriix/detection_image
    # REMOVED: target_frame, max_assoc_dist, spatial_sign_x/y/z, max_person_range
    #   — no longer used, this node has no 3D position or TF dependency at all now

fusion_node:
  ros__parameters:
    tracks_topic: /manriix/cluster_tracks_classified
    person_boxes_topic: /manriix/person_boxes
    output_tracks_topic: /manriix/cluster_tracks_fused
    output_markers_topic: /manriix/fusion_markers
    preview_camera_info_topic: /oak/rgb/preview/camera_info   # NEW
    gamma: 1.5
    freq_window: 2.0
    person_label_hold: 1.5
    min_points_in_box: 5           # NEW — replaces assoc_gate_xy
    max_proj_points_per_cluster: 400   # NEW
    # REMOVED: assoc_gate_xy — replaced by pixel-projection containment
    person_position_percentile: 10.0   # NEW
    
motion_estimation_node:
  ros__parameters:
    tracks_topic: /manriix/cluster_tracks_fused
    output_tracks_topic: /manriix/objects
    output_markers_topic: /manriix/motion_markers

    q_pos: 0.05             # KF process noise, position
    q_vel: 0.5               # KF process noise, velocity
    r_meas: 0.02             # KF measurement noise (centroid jitter)

    lost_keepalive: 2.0        # [s] keep predicting lost objects
    reassoc_mahalanobis: 3.0   # re-association gate
    min_speed_arrow: 0.15      # [m/s] min speed to draw velocity arrow

occupancy_grid_node:
  ros__parameters:
    tracks_topic: /manriix/objects
    map_frame: odom #map
    base_frame: base_footprint

    grid_size: 8.0          # [m]
    resolution: 0.05         # [m/cell]
    # 0 = disabled. Nav2's inflation_layer (inflation_radius=0.45 m)
    # already inflates the same obstacles after they arrive via
    # /manriix/obstacle_cloud; inflating here too was double-inflation.
    inflate_cells: 0

    predict_horizon: 1.0     # [s] sweep dynamic costs along velocity
    predict_steps: 5
    static_hit: 30
    static_decay: 2          # fallback release rate for cells outside the raytrace sample
    static_max: 100
    static_occupied_thresh: 50

    # Sec III-H raytrace clearing (NEW — replaces decay-only "erroneously
    # occupied" release with the paper's actual raytracing method)
    enable_raytrace_clearing: true
    dense_topic: /manriix/points_dense
    raytrace_max_points: 200